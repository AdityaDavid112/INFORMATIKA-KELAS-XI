function checkQuiz(id){const t=TP.find(x=>x.id===id),c=document.getElementById('content');let score=0,answered=0;t.quiz.forEach((q,i)=>{const selected=c.querySelector(`input[name="q${id}-${i}"]:checked`),fb=c.querySelector(`#fb-${id}-${i}`);fb.classList.remove('hide');if(!selected){fb.className='feedback bad';fb.textContent='Belum dijawab. Pilih jawaban terlebih dahulu.';return}answered++;const good=+selected.value===q.a;if(good)score++;fb.className='feedback '+(good?'good':'bad');fb.textContent=(good?'Tepat. ':'Belum tepat. ')+q.why});if(answered===t.quiz.length){state.quizScores[t.page]=score;state.quizDone=Array.from(new Set([...state.quizDone,t.page]));save()}c.querySelector(`#score-${id}`).textContent=`Skor: ${score}/${t.quiz.length} · ${answered===t.quiz.length?'Semua soal dijawab':'Masih ada soal yang belum dijawab'}`;toast(answered===t.quiz.length?'Kuis diperiksa. Baca umpan balik setiap soal.':'Lengkapi semua jawaban untuk menyimpan skor.')}
function initFileManager(c){if(!state.files||!Array.isArray(state.files))state.files=[{name:'Laporan.txt',folder:'Dokumen',type:'file'},{name:'Foto.jpg',folder:'Media',type:'file'},{name:'Video.mp4',folder:'Media',type:'file'},{name:'Dokumen',folder:'/',type:'folder'},{name:'Media',folder:'/',type:'folder'}];const list=c.querySelector('#virtualFileList'),msg=c.querySelector('#fileManagerMsg');function draw(){list.innerHTML=state.files.map((f,i)=>`<div class="file-item"><span>${f.type==='folder'?'📁':'▤'}</span><span class="fname"><strong>${esc(f.name)}</strong><br><span class="muted">${esc(f.folder==='/'?'Lokasi utama':f.folder)}</span></span><button data-op="copy" data-i="${i}">Salin</button><button data-op="move" data-i="${i}">Pindah</button><button data-op="rename" data-i="${i}">Nama</button><button data-op="delete" data-i="${i}">Hapus</button></div>`).join('')||'<div class="empty">Belum ada file. Buat folder atau file untuk memulai.</div>';list.querySelectorAll('button[data-op]').forEach(b=>b.addEventListener('click',()=>operate(b.dataset.op,+b.dataset.i)));}function operate(op,i){const f=state.files[i];if(!f)return;if(op==='copy'){let name=f.name,ext='';if(f.type==='file'&&name.includes('.')){const ix=name.lastIndexOf('.');ext=name.slice(ix);name=name.slice(0,ix)}let newName=name+'_salinan'+ext;if(state.files.some(x=>x.name===newName&&x.folder===f.folder)){msg.textContent='Nama salinan sudah ada. Ganti nama terlebih dahulu.';return}state.files.push({...f,name:newName});msg.textContent=`Salinan "${newName}" dibuat pada ${f.folder}.`}else if(op==='move'){const dest=prompt('Pindahkan ke folder (contoh: Dokumen atau Media):',f.folder==='Dokumen'?'Media':'Dokumen');if(dest===null)return;if(!state.files.some(x=>x.name===dest&&x.type==='folder')){msg.textContent=`Folder "${dest}" tidak ditemukan. Buat folder terlebih dahulu.`;return}if(f.type==='folder'&&dest===f.name){msg.textContent='Folder tidak dapat dipindahkan ke dalam dirinya sendiri.';return}f.folder=dest;msg.textContent=`"${f.name}" dipindahkan ke ${dest}.`}else if(op==='rename'){const name=prompt('Nama baru:',f.name);if(name===null)return;if(!name.trim()||name.includes('/')||state.files.some((x,j)=>j!==i&&x.name===name.trim()&&x.folder===f.folder)){msg.textContent='Nama kosong/tidak valid atau sudah digunakan di lokasi yang sama.';return}const old=f.name;f.name=name.trim();msg.textContent=`"${old}" diubah menjadi "${f.name}".`}else if(op==='delete'){if(!confirm(`Hapus ${f.type==='folder'?'folder':'file'} "${f.name}" dari simulator?`))return;state.files.splice(i,1);msg.textContent=`"${f.name}" dihapus dari simulator. Ini bukan file perangkat asli.`}save();draw()}c.querySelector('#createFolder').addEventListener('click',()=>{const name=c.querySelector('#newFolderName').value.trim();if(!name){msg.textContent='Masukkan nama folder.';return}if(state.files.some(f=>f.name===name&&f.folder==='/')){msg.textContent='Nama sudah digunakan di lokasi utama.';return}state.files.push({name,folder:'/',type:'folder'});c.querySelector('#newFolderName').value='';msg.textContent=`Folder "${name}" dibuat.`;save();draw()});c.querySelector('#createFile').addEventListener('click',()=>{const name=c.querySelector('#newFileName').value.trim();if(!name||name.includes('/')){msg.textContent='Masukkan nama file yang valid.';return}if(state.files.some(f=>f.name===name&&f.folder==='/')){msg.textContent='Nama sudah digunakan di lokasi utama.';return}state.files.push({name,folder:'/',type:'file'});c.querySelector('#newFileName').value='';msg.textContent=`File dummy "${name}" dibuat.`;save();draw()});draw()}
function initTerminal(c){let cwd='/Lab';let fs={'/Lab':{type:'dir',children:['Laporan.txt','Foto.jpg','Dokumen','Media']},'/Lab/Laporan.txt':{type:'file'},'/Lab/Foto.jpg':{type:'file'},'/Lab/Dokumen':{type:'dir',children:['Tugas.txt']},'/Lab/Dokumen/Tugas.txt':{type:'file'},'/Lab/Media':{type:'dir',children:['Video.mp4']},'/Lab/Media/Video.mp4':{type:'file'}};const out=c.querySelector('#shellOutput'),inp=c.querySelector('#termCommand'),shell=c.querySelector('#terminalOS'),prompt=c.querySelector('#termPrompt');function path(p){if(!p||p==='.')return cwd;if(p==='/')return '/';let x=p.startsWith('/')?p:(cwd==='/'?'/'+p:cwd+'/'+p);const parts=[];x.split('/').forEach(v=>{if(!v||v==='.')return;if(v==='..')parts.pop();else parts.push(v)});return '/'+parts.join('/')}function add(s){out.textContent+=(out.textContent?'\\n':'')+s;out.scrollTop=out.scrollHeight}function nameOf(p){return p.split('/').filter(Boolean).pop()||'/'}function parent(p){const a=p.split('/').filter(Boolean);a.pop();return '/'+a.join('/')}function children(p){return Object.keys(fs).filter(k=>k!==p&&parent(k)===p).map(nameOf)}function exists(p){return Object.prototype.hasOwnProperty.call(fs,p)}function run(raw){const win=shell.value==='win';const args=raw.match(/"[^"]*"|'[^']*'|\\S+/g)||[];const cmd=(args.shift()||'').toLowerCase();const unquote=s=>String(s||'').replace(/^["']|["']$/g,'');const arg=args.map(unquote);if(!cmd)return;add((win?'C:\\\\Lab> ':'$ ')+raw);const target=a=>path(a||'.');const renamePath=(p,n)=>parent(p)==='/'?'/'+n:parent(p)+'/'+n;

else if(cmd==='dir'||cmd==='ls'){const p=arg[0]?target(arg[0]):cwd;if(!exists(p)||fs[p].type!=='dir'){add('Error: direktori tidak ditemukan: '+p);return}add(children(p).map(n=>(fs[p==='/'+n?'/'+n:p+'/'+n]||{}).type==='dir'?'[DIR]  '+n:n).join('\\n')||'(direktori kosong)')}

else if(cmd==='copy'||cmd==='cp'){if(arg.length<2){add('Error: gunakan '+cmd+' <sumber> <tujuan>');return}const src=target(arg[0]),dest=target(arg[1]);if(!exists(src)||fs[src].type!=='file'){add('Error: file sumber tidak ditemukan: '+src);return}let final=exists(dest)&&fs[dest].type==='dir'?dest+'/'+nameOf(src):dest;if(exists(final)){add('Error: tujuan sudah ada: '+final);return}if(!exists(parent(final))||fs[parent(final)].type!=='dir'){add('Error: folder tujuan tidak ditemukan.');return}fs[final]={type:'file'};add('File disalin: '+src+' → '+final)}
else if(cmd==='move'||cmd==='mv'){if(arg.length<2){add('Error: gunakan '+cmd+' <sumber> <tujuan>');return}const src=target(arg[0]),dest=target(arg[1]);if(!exists(src)||src==='/Lab'){add('Error: sumber tidak ditemukan atau tidak boleh dipindahkan.');return}let final=exists(dest)&&fs[dest].type==='dir'?dest+'/'+nameOf(src):dest;if(exists(final)){add('Error: tujuan sudah ada: '+final);return}if(!exists(parent(final))||fs[parent(final)].type!=='dir'){add('Error: folder tujuan tidak ditemukan.');return}if(fs[src].type==='dir'&&(final===src||final.startsWith(src+'/'))){add('Error: folder tidak dapat dipindahkan ke dalam dirinya sendiri.');return}fs[final]=fs[src];delete fs[src];if(fs[final].type==='dir'){Object.keys(fs).filter(k=>k.startsWith(src+'/')).forEach(k=>{fs[final+k.slice(src.length)]=fs[k];delete fs[k]})}add('Dipindahkan: '+src+' → '+final)}
else if(cmd==='ren'){if(!win){add('Catatan: gunakan mv untuk mengganti nama di Linux simulator.');return}if(arg.length<2){add('Error: gunakan ren <nama-lama> <nama-baru>');return}const src=target(arg[0]),dest=renamePath(src,arg[1]);if(!exists(src)||exists(dest)||arg[1].includes('/')){add('Error: file tidak ditemukan atau nama tujuan tidak valid/sudah ada.');return}fs[dest]=fs[src];delete fs[src];add('Nama diubah: '+nameOf(src)+' → '+nameOf(dest))}

function assessmentHTML(){const qs=[{q:'Komponen perangkat lunak yang mengelola sumber daya perangkat keras disebut …',opts:['Sistem operasi','Folder','Metadata','Ekstensi'],a:0,why:'Sistem operasi mengelola sumber daya dan layanan sistem.'},{q:'Fungsi driver adalah …',opts:['Mengatur warna wallpaper saja','Membantu OS berkomunikasi dengan perangkat','Menyimpan semua backup','Mengganti nama folder'],a:1,why:'Driver membantu OS berinteraksi dengan perangkat tertentu.'},{q:'Path relatif bergantung pada …',opts:['Lokasi acuan/direktori kerja','Jenis monitor','Warna folder','Kapasitas speaker'],a:0,why:'Path relatif ditafsirkan berdasarkan direktori acuan.'},{q:'Perintah Linux untuk menampilkan direktori kerja adalah …',opts:['pwd','ren','copy','dir'],a:0,why:'pwd menampilkan path direktori kerja.'},{q:'Strategi backup 3-2-1 menyertakan …',opts:['Satu salinan di lokasi berbeda','Satu file dengan tiga nama','Tiga folder di drive yang sama saja','Tidak perlu uji pemulihan'],a:0,why:'Satu salinan offsite mengurangi risiko kejadian lokal merusak semua salinan.'}];return `<div class="lesson-header"><div class="eyebrow">ASSESSMENT CENTER</div><h1>Asesmen Pembelajaran</h1><p class="muted">Latihan diagnostik dan sumatif ringkas untuk memeriksa konsep utama. Soal uraian/praktik tetap perlu dinilai menggunakan rubrik oleh guru.</p></div><section class="lesson-block"><div class="eyebrow">DIAGNOSTIK</div><h2>Sebelum belajar</h2><p>Nilai awal bukan label kemampuan. Gunakan hasilnya untuk menentukan bagian yang perlu dipelajari kembali.</p><div class="quiz-q"><p>Seberapa yakin kamu mengelola file dan folder?</p><div class="sim-controls"><select id="diagConfidence"><option>Belum yakin</option><option>Cukup yakin</option><option>Sangat yakin</option></select></div></div><div class="quiz-q"><p>Apakah kamu pernah menggunakan terminal?</p><label class="option"><input type="radio" name="diagTerm" value="ya"><span>Pernah</span></label><label class="option"><input type="radio" name="diagTerm" value="belum"><span>Belum pernah</span></label></div><button class="btn small" id="saveDiag">Simpan refleksi diagnostik</button></section><section class="lesson-block"><div class="eyebrow">SUMMATIVE PRACTICE</div><h2>Kuis ringkas</h2><div id="assessmentQuiz">${qs.map((q,i)=>`<div class="quiz-q"><p>${i+1}. ${q.q}</p>${q.opts.map((o,j)=>`<label class="option"><input type="radio" name="assess-${i}" value="${j}"><span>${o}</span></label>`).join('')}<div id="assess-fb-${i}" class="feedback hide"></div></div>`).join('')}</div><div class="actions"><button class="btn primary" id="gradeAssessment">Periksa hasil</button><button class="btn" id="resetAssessment">Ulangi</button></div><div class="detailbox" id="assessmentScore">Jawab semua soal untuk memperoleh skor.</div></section><section class="lesson-block"><div class="eyebrow">PRAKTIK & URAIAN</div><h2>Tugas yang dinilai guru</h2><ol><li>Jelaskan perbedaan backup dan sinkronisasi dengan contoh.</li><li>Rancang struktur folder untuk satu proyek kelas dan jelaskan aturan penamaannya.</li><li>Demonstrasikan operasi menyalin, memindahkan, dan mengganti nama file menggunakan GUI atau terminal simulator.</li><li>Jelaskan respons awal yang aman ketika file penting hilang.</li></ol><p class="muted smalltext">Gunakan rubrik proyek akhir sebagai acuan penilaian praktik dan dokumentasi.</p></section>`}
function projectHTML(){const items=['Buat struktur direktori proyek yang logis.','Terapkan aturan penamaan file yang konsisten.','Simpan dokumen, aset, hasil, dan arsip pada folder yang tepat.','Lakukan operasi salin, pindah, ganti nama, dan pencarian.','Tentukan hak akses sesuai kebutuhan.','Rancang backup dengan tiga salinan, dua jenis media, dan satu salinan offsite.','Uji atau dokumentasikan prosedur pemulihan.','Siapkan dokumentasi dan presentasi hasil.'];return `<div class="lesson-header"><div class="eyebrow">CAPSTONE PROJECT</div><h1>Membangun Sistem Pengelolaan File yang Terstruktur, Aman, dan Efisien</h1><p class="muted">Gabungkan keterampilan dari keenam TP dalam solusi pengelolaan file untuk proyek kelas atau kegiatan sekolah.</p></div><section class="lesson-block"><div class="eyebrow">THE CHALLENGE</div><h2>Skenario</h2><p>Sebuah kelompok siswa mengerjakan proyek multimedia. File tersebar di beberapa folder, nama file tidak konsisten, terdapat duplikasi, dan belum ada strategi backup yang jelas. Kelompok harus merancang sistem pengelolaan file yang mudah dipahami, aman, dan dapat dipulihkan.</p><h3>Produk yang diharapkan</h3><ul><li>Diagram/pohon struktur direktori.</li><li>Aturan penamaan dan contoh file.</li><li>Catatan operasi manajemen file.</li><li>Rencana permission dan backup.</li><li>Dokumentasi langkah kerja, kendala, dan solusi.</li><li>Presentasi singkat yang menjelaskan keputusan desain.</li></ul></section><section class="lesson-block"><div class="eyebrow">PROJECT CHECKLIST</div><h2>Pantau kemajuan</h2><div class="checklist">${items.map((x,i)=>`<label class="checkline ${state.checks[i]?'done':''}"><input type="checkbox" data-project-check="${i}" ${state.checks[i]?'checked':''}><span>${x}</span></label>`).join('')}</div><div class="bar" style="margin-top:14px"><span id="projectBar" style="width:${items.filter((x,i)=>state.checks[i]).length/items.length*100}%"></span></div><p class="muted smalltext" id="projectProgress">${items.filter((x,i)=>state.checks[i]).length} dari ${items.length} langkah selesai.</p></section><section class="lesson-block"><div class="eyebrow">DOCUMENTATION</div><h2>Catatan proyek</h2><label class="smalltext muted">Nama proyek / anggota / pembagian peran</label><textarea data-project-note="team" placeholder="Nama proyek, anggota, peran...">${esc(state.notes.projectTeam||'')}</textarea><label class="smalltext muted">Kendala, strategi, dan hasil</label><textarea data-project-note="result" placeholder="Jelaskan keputusan desain, hasil uji, dan hal yang perlu ditingkatkan...">${esc(state.notes.projectResult||'')}</textarea><button class="btn small" id="saveProjectNotes">Simpan dokumentasi</button></section><section class="lesson-block"><div class="eyebrow">ASSESSMENT RUBRIC</div><h2>Rubrik penilaian proyek</h2><div class="compare-wrap"><table class="compare"><thead><tr><th>Kriteria</th><th>Bobot</th><th>Indikator ringkas</th></tr></thead><tbody><tr><td>Struktur direktori</td><td>20%</td><td>Logis, konsisten, dan mudah dinavigasi.</td></tr><tr><td>Operasi file</td><td>20%</td><td>Operasi dilakukan tepat dan dapat dijelaskan.</td></tr><tr><td>Penamaan dan pencarian</td><td>15%</td><td>Nama deskriptif dan file mudah ditemukan.</td></tr><tr><td>Keamanan dan backup</td><td>20%</td><td>Hak akses dan strategi backup sesuai risiko.</td></tr><tr><td>Dokumentasi</td><td>15%</td><td>Langkah, bukti, dan kesimpulan jelas.</td></tr><tr><td>Kolaborasi dan presentasi</td><td>10%</td><td>Peran seimbang dan keputusan disampaikan dengan jelas.</td></tr><tr><td><strong>Total</strong></td><td><strong>100%</strong></td><td></td></tr></tbody></table></div><div class="callout">Skor akhir perlu ditentukan guru berdasarkan bukti pekerjaan dan level performa yang disepakati. Checklist di atas hanya memantau proses, bukan memberikan nilai otomatis.</div></section>`}
function glossaryHTML(){return `<div class="lesson-header"><div class="eyebrow">REFERENCE DESK</div><h1>Glosarium</h1><p class="muted">Istilah kunci untuk membantu membaca materi dan dokumentasi teknis.</p><input id="glossarySearch" placeholder="Cari istilah..." style="width:100%;max-width:500px;margin-top:10px"></div><div class="glossary" id="glossaryItems">${GLOSSARY.map(([a,b])=>`<article class="term" data-term="${esc((a+' '+b).toLowerCase())}"><strong>${esc(a)}</strong><p>${esc(b)}</p></article>`).join('')}</div>`}
function referencesHTML(){return `<div class="lesson-header"><div class="eyebrow">SOURCE LIBRARY</div><h1>Referensi & Sumber Belajar</h1><p class="muted">Gunakan sumber tepercaya untuk memverifikasi istilah, langkah kerja, dan detail yang dapat berbeda antarversi.</p></div><section class="lesson-block"><h2>Dokumentasi resmi</h2><ul class="source-list"><li><a href="https://support.microsoft.com/id-id/windows/experience/fileexplorer/file-explorer-in-windows" target="_blank" rel="noopener noreferrer">Microsoft Support — File Explorer di Windows</a><br><span class="muted smalltext">Panduan menelusuri, membuka, dan mengelola file/folder.</span></li><li><a href="https://support.microsoft.com/id-id/windows/experience/storage-filemanagement/find-your-files-and-apps-in-windows" target="_blank" rel="noopener noreferrer">Microsoft Support — Menemukan file dan aplikasi di Windows</a><br><span class="muted smalltext">Pencarian file dan aplikasi pada Windows.</span></li><li><a href="https://help.ubuntu.com/stable/ubuntu-help/files.html.en" target="_blank" rel="noopener noreferrer">Ubuntu Documentation — Files, folders & search</a><br><span class="muted smalltext">Penelusuran, penyalinan, pemindahan, penghapusan, pencarian, dan pengelolaan file di Ubuntu.</span></li><li><a href="https://kurikulum.kemdikbud.go.id/" target="_blank" rel="noopener noreferrer">Portal Kurikulum — Kementerian Pendidikan</a><br><span class="muted smalltext">Rujukan untuk memeriksa dokumen kurikulum yang relevan.</span></li></ul><div class="callout warning"><strong>Catatan kurikulum:</strong> CP resmi harus dicocokkan dengan mata pelajaran, program keahlian, fase, dan dokumen kurikulum yang berlaku di sekolah. Rumusan operasional bab dalam web app ini tidak otomatis merupakan kutipan CP resmi.</div><h2>Catatan penggunaan</h2><p>Materi pada web app ini merupakan bahan belajar umum. Antarmuka, perintah, dukungan aplikasi, dan mekanisme keamanan dapat berbeda menurut versi OS, konfigurasi, dan kebijakan sekolah. Uji perintah hanya di simulator atau lingkungan latihan yang aman.</p></section>`}
function attachExtraHandlers(page){const c=document.getElementById('content');if(page==='lkpd'){c.querySelectorAll('[data-save-lkpd]').forEach(b=>b.addEventListener('click',()=>{state.answers[b.dataset.saveLkpd]=c.querySelector(`#lkpd-${b.dataset.saveLkpd}`).value;save();toast('Jawaban LKPD disimpan.')}));c.querySelector('#saveAllLKPD').addEventListener('click',()=>{c.querySelectorAll('[data-lkpd]').forEach(x=>state.answers[x.dataset.lkpd]=x.value);save();toast('Semua jawaban LKPD disimpan.')})}
if(page==='assessment'){c.querySelector('#saveDiag').addEventListener('click',()=>{const conf=c.querySelector('#diagConfidence').value,term=c.querySelector('input[name="diagTerm"]:checked')?.value||'belum dijawab';state.notes.diagnostic=`Keyakinan: ${conf}; pengalaman terminal: ${term}`;save();toast('Refleksi diagnostik disimpan.')});const qs=[{a:0,why:'Sistem operasi mengelola sumber daya dan layanan sistem.'},{a:1,why:'Driver membantu OS berinteraksi dengan perangkat tertentu.'},{a:0,why:'Path relatif ditafsirkan berdasarkan direktori acuan.'},{a:0,why:'pwd menampilkan path direktori kerja.'},{a:0,why:'Satu salinan di lokasi berbeda mengurangi risiko lokal.'}];c.querySelector('#gradeAssessment').addEventListener('click',()=>{let score=0,answered=0;qs.forEach((q,i)=>{const sel=c.querySelector(`input[name="assess-${i}"]:checked`),fb=c.querySelector(`#assess-fb-${i}`);fb.classList.remove('hide');if(!sel){fb.className='feedback bad';fb.textContent='Belum dijawab.';return}answered++;const good=+sel.value===q.a;if(good)score++;fb.className='feedback '+(good?'good':'bad');fb.textContent=(good?'Tepat. ':'Belum tepat. ')+q.why});c.querySelector('#assessmentScore').textContent=`Skor latihan: ${score}/5 · ${answered}/5 soal dijawab. Ini latihan ringkas, bukan pengganti asesmen praktik guru.`;state.quizScores.assessment=score;save()});c.querySelector('#resetAssessment').addEventListener('click',()=>{c.querySelectorAll('input[name^="assess-"]').forEach(x=>x.checked=false);c.querySelectorAll('[id^="assess-fb-"]').forEach(x=>{x.className='feedback hide';x.textContent=''});c.querySelector('#assessmentScore').textContent='Jawab semua soal untuk memperoleh skor.'})}
if(page==='project'){c.querySelectorAll('[data-project-check]').forEach(x=>x.addEventListener('change',()=>{state.checks[x.dataset.projectCheck]=x.checked;save();const n=c.querySelectorAll('[data-project-check]:checked').length;c.querySelector('#projectBar').style.width=(n/8*100)+'%';c.querySelector('#projectProgress').textContent=`${n} dari 8 langkah selesai.`;x.closest('.checkline').classList.toggle('done',x.checked)}));c.querySelector('#saveProjectNotes').addEventListener('click',()=>{state.notes.projectTeam=c.querySelector('[data-project-note="team"]').value;state.notes.projectResult=c.querySelector('[data-project-note="result"]').value;save();toast('Dokumentasi proyek disimpan.')})}
if(page==='glossary'){c.querySelector('#glossarySearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();c.querySelectorAll('[data-term]').forEach(x=>x.classList.toggle('hide',!x.dataset.term.includes(q)))})}}
const oldAttach=attachPageHandlers;
attachPageHandlers=function(page){oldAttach(page);attachExtraHandlers(page)};
go('home');
</script>
</body>
</html>
