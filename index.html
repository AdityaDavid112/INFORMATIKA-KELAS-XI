<script>
const TP = [
{ id:1, page:'tp1', icon:'◈', title:'Konsep Dasar Sistem Operasi', short:'Memahami peran OS sebagai penghubung pengguna, aplikasi, dan perangkat keras.', duration:'35–45 menit', objectives:['Menjelaskan pengertian sistem operasi dengan kata-kata sendiri.','Menguraikan tujuan dan peran sistem operasi.','Menjelaskan hubungan pengguna, aplikasi, sistem operasi, dan perangkat keras.','Mengidentifikasi sistem operasi pada perangkat yang digunakan sehari-hari.'], prompt:'Apa yang terjadi jika komputer memiliki perangkat keras yang lengkap, tetapi tidak memiliki sistem operasi?', sections:[
{title:'Apa itu sistem operasi?',body:'Sistem operasi (Operating System/OS) adalah perangkat lunak sistem yang mengelola sumber daya perangkat keras dan menyediakan layanan bagi aplikasi. OS menjadi perantara agar pengguna dan program dapat menggunakan komputer tanpa harus mengendalikan setiap komponen perangkat keras secara langsung.',sub:'Sistem operasi bukan sekadar tampilan desktop. Di balik antarmuka yang terlihat, OS mengatur proses, memori, perangkat masukan/keluaran, sistem file, akun pengguna, dan banyak layanan lain.'},
{title:'Tujuan dan peran utama',body:'Sistem operasi membantu komputer bekerja dengan nyaman, efisien, dan teratur. OS menyediakan antarmuka, mengoordinasikan penggunaan CPU dan memori, mengatur akses perangkat, menyimpan serta menemukan file, dan menerapkan mekanisme keamanan dasar.',list:['Kenyamanan: menyediakan cara yang mudah untuk berinteraksi dengan komputer.','Efisiensi: membagi sumber daya di antara aplikasi yang berjalan.','Pengelolaan: mengoordinasikan perangkat keras dan perangkat lunak.','Keamanan: membantu mengatur akun dan hak akses.','Abstraksi: menyembunyikan kerumitan perangkat keras melalui layanan yang konsisten.']},
{title:'Hubungan pengguna, aplikasi, OS, dan perangkat keras',body:'Ketika pengguna mengeklik tombol pada aplikasi, aplikasi meminta layanan kepada sistem operasi. OS lalu berkoordinasi dengan driver dan perangkat keras yang dibutuhkan. Hasil operasi dikembalikan ke aplikasi dan ditampilkan kepada pengguna.',sub:'Contoh: saat menyimpan dokumen, aplikasi pengolah kata meminta OS menulis data ke sistem file. OS mengelola operasi penyimpanan dan melaporkan hasilnya.'},
{title:'Contoh sistem operasi dalam kehidupan sehari-hari',body:'Windows banyak digunakan pada PC; macOS pada komputer Mac; distribusi Linux digunakan pada komputer pribadi, server, dan lingkungan pengembangan; Android digunakan pada banyak ponsel dan tablet; iOS digunakan pada iPhone. Setiap sistem memiliki rancangan, ekosistem, dukungan perangkat, dan model pengelolaan yang berbeda.',sub:'Nama sistem operasi tidak selalu sama dengan nama perangkat. Periksa informasi perangkat atau dokumentasi produsennya untuk mengetahui OS dan versinya.'}
], activity:'Buat diagram sederhana hubungan pengguna, aplikasi, sistem operasi, dan perangkat keras. Tambahkan satu contoh kegiatan, misalnya membuka foto atau menyimpan dokumen, lalu jelaskan alur permintaan dan hasilnya.',group:'Dalam kelompok, inventarisasi minimal empat perangkat yang sering digunakan. Catat jenis perangkat, sistem operasi yang diketahui, kegiatan utama, dan sumber informasi. Presentasikan alasan OS dapat berbeda antarperangkat.',quiz:[
{q:"Seorang siswa membuka aplikasi pengolah kata, tetapi aplikasi itu tidak perlu mengetahui cara kerja SSD secara langsung. Ketika ia menekan Simpan, aplikasi meminta layanan sistem. Kesimpulan mana yang paling tepat?",opts:["Aplikasi mengendalikan SSD sendiri tanpa perantara","Sistem operasi menyediakan layanan agar aplikasi dapat menyimpan data melalui sistem file","SSD bertindak sebagai sistem operasi","Tombol Simpan mengubah perangkat keras menjadi perangkat lunak"],a:1,why:"Aplikasi umumnya meminta layanan sistem operasi untuk menulis data ke sistem file; OS mengoordinasikan operasi penyimpanan."},
{q:"Komputer memiliki CPU, RAM, dan SSD, tetapi tidak memiliki sistem operasi maupun perangkat lunak sistem pengganti. Pengguna ingin menjalankan aplikasi biasa dari antarmuka desktop. Analisis yang paling masuk akal adalah …",opts:["Aplikasi desktop pasti berjalan karena perangkat keras sudah lengkap","Pengguna dapat membuka semua file melalui folder secara otomatis","Aplikasi biasa tidak memiliki lingkungan layanan yang diperlukan untuk dijalankan seperti biasa","SSD akan mengambil alih fungsi pengelolaan proses"],a:2,why:"Perangkat keras saja tidak menyediakan lingkungan umum untuk memuat dan menjalankan aplikasi desktop; dibutuhkan OS atau sistem perangkat lunak yang sesuai."},
{q:"Sebuah aplikasi musik berhenti merespons, tetapi aplikasi lain masih berjalan. Teknisi ingin mencegah masalah satu aplikasi mengganggu seluruh komputer. Peran OS yang paling relevan untuk dianalisis adalah …",opts:["Mengatur proses dan membantu mengisolasi aplikasi","Mengubah semua file musik menjadi gambar","Menambah kapasitas fisik SSD secara otomatis","Menggantikan fungsi seluruh aplikasi"],a:0,why:"OS mengelola proses dan sumber daya serta membantu membatasi dampak proses yang bermasalah, meskipun hasilnya bergantung pada kondisi sistem."}
]},
{ id:2, page:'tp2', icon:'⚙', title:'Fungsi dan Mekanisme Sistem Operasi', short:'Mengeksplorasi proses, memori, perangkat, booting, GUI, CLI, dan troubleshooting.', duration:'45–60 menit', objectives:['Mengidentifikasi fungsi pengelolaan proses, memori, perangkat, dan file.','Menjelaskan tahapan umum booting.','Membedakan GUI dan CLI.','Menerapkan langkah awal pemecahan masalah sederhana.'], prompt:'Mengapa komputer dapat menjalankan browser, pemutar musik, dan aplikasi pesan pada waktu yang hampir bersamaan?', sections:[
{title:'Pengelolaan proses',body:'Proses adalah program yang sedang berjalan beserta keadaan dan sumber daya yang digunakan. Sistem operasi membuat dan mengakhiri proses, mengatur giliran penggunaan CPU, serta membantu menjaga agar proses tidak saling mengganggu. Sebuah proses dapat memiliki satu atau lebih thread yang menjalankan bagian pekerjaan.',list:['Status proses dapat berubah, misalnya siap, berjalan, atau menunggu.','CPU menjalankan instruksi; penjadwal menentukan proses mana yang mendapat giliran.','Perpindahan giliran yang cepat membantu menciptakan kesan multitasking.']},
{title:'Pengelolaan memori',body:'RAM menyimpan data dan instruksi yang sedang dibutuhkan aplikasi. OS melacak penggunaan memori dan menyediakan ruang kerja bagi proses. Jika tekanan memori meningkat, kinerja dapat menurun; sistem mungkin menggunakan mekanisme memori virtual, tetapi ini bukan pengganti RAM yang sepenuhnya setara.',sub:'Menutup aplikasi yang tidak diperlukan dapat membantu membebaskan sumber daya. Jangan menghapus file sistem untuk mencoba memperbaiki masalah memori.'},
{title:'Input/output, driver, dan sistem file',body:'OS menyediakan cara terstandar bagi aplikasi untuk berkomunikasi dengan perangkat. Driver membantu OS berinteraksi dengan perangkat tertentu. Sistem file mengatur bagaimana file dan direktori disimpan, diberi nama, ditemukan, dan diakses.',list:['Input: keyboard, mouse, mikrofon, pemindai.','Output: layar, speaker, printer.','Penyimpanan: SSD, HDD, flash drive, dan media lain.']},
{title:'Booting, GUI, dan CLI',body:'Booting adalah proses awal saat perangkat dinyalakan: firmware melakukan pemeriksaan dan memilih media boot, lalu bootloader membantu memuat kernel OS. Setelah komponen sistem dimulai, layanan dan antarmuka pengguna tersedia. Rincian proses berbeda antarperangkat dan sistem operasi.',sub:'GUI (Graphical User Interface) menggunakan elemen visual seperti jendela dan ikon. CLI (Command-Line Interface) menerima perintah teks. Keduanya merupakan cara berinteraksi dengan sistem; masing-masing memiliki kelebihan.'},
{title:'Troubleshooting dasar',body:'Mulailah dari gejala dan perubahan terbaru. Periksa pesan kesalahan, ruang penyimpanan, koneksi perangkat, dan apakah aplikasi merespons. Simpan pekerjaan sebelum menutup aplikasi atau memulai ulang. Hindari mengubah pengaturan sistem yang tidak dipahami.',list:['Catat gejala dan kapan masalah terjadi.','Periksa kabel, daya, koneksi, dan ruang penyimpanan.','Coba langkah aman dan dapat dibatalkan.','Cari dokumentasi resmi untuk pesan kesalahan.','Minta bantuan teknisi jika masalah menyangkut data penting atau perangkat keras.']}
],activity:'Gunakan simulator proses dan RAM. Ubah jumlah aplikasi aktif, amati perubahan penggunaan memori, lalu tuliskan dua hal yang dapat memengaruhi kinerja komputer.',group:'Buat poster alur booting dan presentasikan fungsi umum firmware, bootloader, kernel, layanan sistem, dan antarmuka. Beri catatan bahwa implementasi berbeda antarperangkat.',quiz:[
{q:"Laptop melambat setelah siswa membuka banyak tab browser, editor video, dan aplikasi konferensi. Penggunaan RAM mendekati penuh, sedangkan ruang SSD masih cukup. Langkah awal yang paling rasional adalah …",opts:["Menghapus folder sistem agar RAM kosong","Menutup aplikasi atau tab yang tidak diperlukan lalu memeriksa perubahan kinerja","Mengganti nama seluruh file pribadi","Menginstal driver printer berulang kali"],a:1,why:"Beban aplikasi dapat meningkatkan tekanan memori; menutup yang tidak diperlukan merupakan langkah awal yang aman dan dapat dievaluasi."},
{q:"Setelah printer baru dipasang, komputer mengenali perangkat tetapi tidak dapat mencetak dengan benar. Komponen yang paling layak diperiksa terlebih dahulu adalah …",opts:["Driver printer dan kompatibilitasnya dengan OS","Nama folder Dokumen","Wallpaper desktop","Ekstensi file foto pribadi"],a:0,why:"Driver membantu sistem operasi berkomunikasi dengan perangkat. Driver yang tidak sesuai dapat menyebabkan fungsi perangkat terganggu."},
{q:"Komputer dinyalakan. Firmware memulai pemeriksaan awal dan memilih media boot sebelum kernel sistem operasi dimuat. Jika proses berhenti sebelum kernel dimulai, area pemeriksaan awal yang paling relevan adalah …",opts:["Urutan boot dan komponen bootloader","Warna ikon aplikasi","Struktur folder unduhan","Riwayat penamaan dokumen"],a:0,why:"Pemilihan media boot dan pemuatan kernel terjadi pada tahap awal sebelum layanan dan antarmuka OS tersedia."}
]},
{ id:3, page:'tp3', icon:'▤', title:'Perbandingan Sistem Operasi', short:'Membandingkan OS berdasarkan perangkat, ekosistem, keamanan, dan kebutuhan.', duration:'35–45 menit', objectives:['Menyebutkan karakteristik beberapa sistem operasi.','Membandingkan OS berdasarkan kriteria yang relevan.','Memilih OS berdasarkan skenario penggunaan dan menjelaskan alasannya.'], prompt:'Apakah sistem operasi yang paling populer pasti menjadi pilihan terbaik untuk semua kebutuhan?', sections:[
{title:'Mengapa sistem operasi berbeda?',body:'Sistem operasi dirancang untuk perangkat, pengguna, dan ekosistem yang beragam. Pilihan dipengaruhi kompatibilitas aplikasi, dukungan perangkat, biaya, kebijakan organisasi, kebutuhan aksesibilitas, keamanan, pemeliharaan, dan pengalaman pengguna.',sub:'Tidak ada satu OS yang selalu terbaik untuk seluruh situasi. Bandingkan kebutuhan nyata, bukan hanya popularitas atau tampilan.'},
{title:'Windows',body:'Windows banyak digunakan pada PC dan laptop. Ekosistemnya luas, dengan dukungan aplikasi konsumen, bisnis, dan permainan yang beragam. Pengalaman dan fitur keamanan bergantung pada edisi, versi, konfigurasi, serta pembaruan. Kebutuhan lisensi dan kompatibilitas perlu diperiksa sesuai konteks.'},
{title:'Linux dan distribusinya',body:'Linux sering merujuk pada keluarga sistem operasi yang memakai kernel Linux, umumnya dipaketkan bersama perangkat lunak lain sebagai distribusi. Banyak distribusi menyediakan perangkat lunak sumber terbuka dan pilihan konfigurasi yang luas. Dukungan aplikasi komersial dan perangkat tertentu dapat berbeda antar-distribusi.'},
{title:'macOS',body:'macOS digunakan pada komputer Mac dan terintegrasi dengan ekosistem perangkat serta layanan Apple. Integrasi perangkat keras dan perangkat lunak dapat menjadi kelebihan, sementara pilihan perangkat dan kebutuhan kompatibilitas aplikasi perlu dipertimbangkan.'},
{title:'Android dan iOS',body:'Android digunakan pada banyak perangkat dari berbagai produsen, sehingga bentuk perangkat, kebijakan pembaruan, dan antarmuka dapat bervariasi. iOS dirancang untuk iPhone dan dikelola dalam ekosistem Apple. Pertimbangkan masa dukungan pembaruan, kebutuhan aplikasi, aksesibilitas, privasi, dan kebijakan perangkat.'}
],activity:'Pilih dua sistem operasi dan isi tabel perbandingan minimal lima aspek. Sertakan sumber informasi untuk setiap klaim yang mudah berubah, seperti dukungan versi atau persyaratan perangkat.',group:'Analisis tiga skenario: laboratorium sekolah, studio kreatif, dan server layanan web. Sepakati pilihan OS yang masuk akal untuk masing-masing dan jelaskan trade-off-nya.',quiz:[
{q:"Sekolah hendak memilih sistem operasi untuk laboratorium desain. Aplikasi utama hanya tersedia dan didukung penuh pada Windows, perangkat lab sudah kompatibel, dan sekolah memiliki lisensi sah. Pilihan yang paling kuat berdasarkan kebutuhan tersebut adalah …",opts:["Memilih Windows karena sesuai kebutuhan aplikasi dan kondisi lisensi","Memilih Linux hanya karena semua distribusinya selalu menjalankan aplikasi Windows secara asli","Memilih macOS tanpa memeriksa kompatibilitas perangkat keras","Memilih OS secara acak karena semua sistem selalu identik"],a:0,why:"Pilihan OS perlu mengikuti kompatibilitas aplikasi, perangkat, biaya, dan kebutuhan nyata; skenario ini secara eksplisit mendukung Windows."},
{q:"Tim pengelola server ingin mengurangi biaya lisensi, melakukan otomasi lewat terminal, dan memiliki kemampuan teknis merawat sistem. Faktor-faktor ini membuat Linux layak dipertimbangkan, tetapi keputusan akhir tetap perlu memeriksa …",opts:["Kompatibilitas layanan, dukungan perangkat lunak, keamanan, dan kemampuan pemeliharaan","Apakah nama distribusinya paling pendek","Apakah tampilannya sama persis dengan semua OS lain","Apakah sistem operasi tidak pernah membutuhkan pembaruan"],a:0,why:"Keputusan profesional tetap perlu mempertimbangkan kebutuhan layanan, dukungan, keamanan, dan kapasitas tim; tidak ada OS yang bebas pemeliharaan."},
{q:"Seorang siswa menyimpulkan bahwa OS dengan pengguna terbanyak pasti paling aman dan paling cocok untuk semua perangkat. Evaluasi terbaik terhadap kesimpulan itu adalah …",opts:["Benar, popularitas menjamin keamanan dan kecocokan universal","Kurang tepat; keamanan dan kecocokan bergantung pada konfigurasi, pembaruan, kebutuhan, serta dukungan perangkat","Benar, karena semua OS memiliki fitur dan risiko yang sama","Kurang tepat hanya jika perangkat memiliki layar sentuh"],a:1,why:"Popularitas tidak otomatis menjamin keamanan atau kecocokan. Faktor konfigurasi, pembaruan, ekosistem, dan kebutuhan pengguna tetap harus dinilai."}
]},
{ id:4, page:'tp4', icon:'▱', title:'File, Folder, dan Struktur Direktori', short:'Memahami ekstensi, path, metadata, penamaan, dan organisasi direktori.', duration:'40–50 menit', objectives:['Membedakan file dan folder.','Menjelaskan ekstensi, metadata, dan path.','Membaca struktur direktori dan membedakan path absolut serta relatif.','Merancang aturan penamaan dan struktur folder yang konsisten.'], prompt:'Jika semua file disimpan dalam satu folder dengan nama yang acak, seberapa mudah kamu menemukan tugas semester lalu?', sections:[
{title:'File dan folder',body:'File adalah unit data yang disimpan dengan nama dan isi tertentu, misalnya dokumen, gambar, audio, video, atau arsip. Folder/direktori digunakan untuk mengelompokkan file dan folder lain. Struktur bertingkat membantu informasi ditemukan secara konsisten.',sub:'Ikon file dan folder dapat berbeda antar-OS. Gunakan nama, lokasi, dan properti untuk memahami objek; jangan mengandalkan ikon saja.'},
{title:'Ekstensi file',body:'Ekstensi adalah bagian nama file yang sering muncul setelah titik terakhir, misalnya .pdf, .jpg, .mp3, atau .zip. Ekstensi memberi petunjuk tentang format, tetapi tidak membuktikan isi file secara mutlak. File dapat memiliki ekstensi yang salah atau berbahaya.',list:['.txt: teks biasa; .pdf: dokumen dengan tata letak tetap.','.jpg/.png: gambar; .mp3/.wav: audio.','.mp4: video; .zip: arsip terkompresi.','.docx/.xlsx/.pptx: format dokumen perkantoran yang umum.']},
{title:'Path absolut dan relatif',body:'Path menunjukkan lokasi objek dalam struktur direktori. Path absolut menjelaskan lokasi dari titik acuan sistem file, sedangkan path relatif ditafsirkan dari direktori kerja atau lokasi acuan. Bentuk path berbeda antar-OS.',sub:'Contoh Windows: C:\\\\Users\\\\Siswa\\\\Documents\\\\Tugas.docx. Contoh Linux: /home/siswa/dokumen/tugas.txt. Path relatif seperti dokumen/tugas.txt bergantung pada direktori saat ini.'},
{title:'Metadata dan penamaan',body:'Metadata adalah informasi tentang file, misalnya ukuran, waktu modifikasi, pemilik, atau jenis. Metadata yang tersedia bergantung pada sistem file dan aplikasi. Penamaan yang konsisten membuat file lebih mudah dicari dan mengurangi duplikasi.',list:['Gunakan nama deskriptif, misalnya KelasXI_TugasOS_2026-10-27.docx.','Hindari nama ambigu seperti final_baru_banget2.','Pilih format tanggal yang konsisten, misalnya YYYY-MM-DD.','Pisahkan topik, jenis dokumen, dan versi bila dibutuhkan.']}
],activity:'Gunakan pohon direktori interaktif. Pilih beberapa file untuk memeriksa ekstensi, path, dan metadata contoh. Buat aturan penamaan untuk lima file tugas sekolah.',group:'Rancang struktur direktori bersama untuk proyek kelas. Pastikan struktur mencakup dokumen, aset, hasil, dan arsip; tuliskan aturan nama file dan cara menghindari duplikasi.',quiz:[
{q:"Kelompok kelas mengumpulkan 40 dokumen dengan nama seperti tugas.docx, tugas-final.docx, dan tugas-final-baru.docx. Mereka sering salah mengirim versi. Perbaikan paling efektif adalah …",opts:["Menyimpan semua dokumen di satu folder tanpa mengubah nama","Menerapkan struktur folder dan pola nama yang memuat topik, pemilik atau kelompok, tanggal, serta versi bila perlu","Mengganti semua ekstensi menjadi .txt","Mengandalkan warna ikon untuk membedakan versi"],a:1,why:"Struktur folder dan konvensi nama yang konsisten membantu membedakan dokumen serta mengurangi kekeliruan memilih versi."},
{q:"File bernama laporan.jpg ternyata tidak dapat dibuka sebagai gambar dan isi file diduga berupa dokumen teks yang salah diberi nama. Tindakan analitis yang paling tepat adalah …",opts:["Menganggap ekstensi selalu membuktikan isi file","Memeriksa sumber dan jenis file dengan alat yang sesuai sebelum mengganti ekstensi atau membuka file","Menghapus file tanpa pemeriksaan","Mengubah nama folder induk saja"],a:1,why:"Ekstensi adalah petunjuk format, bukan bukti mutlak isi file. Periksa sumber dan tipe sebenarnya sebelum melakukan perubahan."},
{q:"Sebuah instruksi meminta siswa membuka file presentasi di folder Proyek, sedangkan direktori kerja saat ini adalah folder Dokumen. Mengapa path relatif yang hanya bertuliskan presentasi.pptx mungkin gagal?",opts:["Path relatif ditafsirkan dari lokasi acuan saat ini, yang mungkin bukan folder Proyek","Path relatif selalu menunjuk ke folder root","Nama file tidak boleh memiliki titik","Semua folder otomatis memiliki isi yang sama"],a:0,why:"Path relatif bergantung pada direktori kerja atau lokasi acuan. Jika file berada di folder lain, nama file saja mungkin tidak cukup."}
]},
{ id:5, page:'tp5', icon:'⌘', title:'Operasi Manajemen File', short:'Berlatih membuat, menyalin, memindahkan, mengganti nama, dan mencari file.', duration:'50–65 menit', objectives:['Melakukan operasi file melalui antarmuka grafis.','Memahami perintah dasar Windows CMD dan Linux.','Memilih metode GUI atau CLI sesuai tugas.','Mempraktikkan operasi file secara aman.'], prompt:'Bagaimana kamu memastikan file dipindahkan ke folder yang benar tanpa kehilangan salinan penting?', sections:[
{title:'Manajemen file melalui GUI',body:'File manager seperti File Explorer pada Windows dan aplikasi Files pada Ubuntu membantu pengguna menelusuri folder, memilih objek, menyalin, memindahkan, mengganti nama, menghapus, dan mencari file. Sebelum operasi penting, periksa lokasi asal dan tujuan.',list:['Salin (copy): membuat salinan di lokasi lain.','Pindahkan (move): mengubah lokasi objek.','Ganti nama (rename): mengubah nama objek.','Hapus (delete): memindahkan ke tempat sampah atau menghapus sesuai sistem dan pengaturan.','Cari (search): menemukan objek berdasarkan nama atau kriteria yang tersedia.']},
{title:'Dasar CLI',body:'CLI memungkinkan operasi dilakukan dengan perintah teks. Perintah yang tepat dapat mempercepat pekerjaan berulang, tetapi path, spasi, izin, dan direktori kerja harus diperiksa. Perintah dan opsi dapat berbeda antara shell dan sistem operasi.',sub:'Windows CMD: dir, cd, mkdir, copy, move, ren. Linux: pwd, ls, cd, mkdir, cp, mv. Contoh di bawah dijalankan hanya dalam terminal virtual web app ini.'},
{title:'Praktik aman',body:'Sebelum menyalin atau memindahkan file, periksa sumber dan tujuan. Saat mengganti nama, pastikan nama baru tidak menimpa file lain. Sebelum menghapus, periksa kembali pilihan. Untuk data penting, siapkan backup yang telah diuji.',list:['Perhatikan pesan konfirmasi dan kesalahan.','Gunakan nama dan folder tujuan yang jelas.','Jangan menjalankan perintah yang tidak dipahami.','Latih perintah destruktif hanya pada file dummy.']}
], activity:'Gunakan File Manager Simulator untuk membuat folder latihan, menyalin satu file, mengganti namanya, lalu memindahkannya. Catat lokasi sebelum dan sesudah operasi.',group:'Buat panduan satu halaman berisi langkah GUI dan padanan CLI untuk membuat folder, menyalin, memindahkan, dan mengganti nama file. Uji panduan pada simulator dan tukar hasil dengan kelompok lain.',quiz:[
{q:"Siswa perlu menyalin 200 file dari satu folder ke folder lain dengan pola yang berulang. Ia sudah memahami perintah dan memeriksa path sumber serta tujuan. Metode yang paling efisien adalah …",opts:["Memakai CLI dengan perintah yang tepat dan memeriksa hasilnya","Membuka setiap file satu per satu lalu menyimpannya dengan nama acak","Menghapus folder sumber sebelum menyalin","Mengganti ekstensi semua file agar lebih mudah dipilih"],a:0,why:"CLI dapat efisien untuk operasi berulang setelah perintah, path, dan dampaknya dipahami; hasil tetap perlu diverifikasi."},
{q:"Seorang siswa berada di direktori /home/siswa/tugas dan menjalankan perintah pwd. Ia ingin mengetahui mengapa perintah itu berguna sebelum menjalankan mv. Penjelasan terbaik adalah …",opts:["pwd menampilkan direktori kerja sehingga membantu memeriksa konteks path relatif","pwd memindahkan semua file ke folder utama","pwd memastikan file telah dicadangkan","pwd mengubah hak akses seluruh file"],a:0,why:"pwd menampilkan direktori kerja saat ini; informasi ini membantu menafsirkan path relatif sebelum melakukan operasi file."},
{q:"Sebuah perintah pemindahan gagal karena nama folder tujuan mengandung spasi. Sebelum mencoba perintah lain, tindakan paling aman adalah …",opts:["Memeriksa pesan kesalahan dan menuliskan path dengan sintaks yang benar untuk shell yang digunakan","Menjalankan perintah penghapusan untuk mengosongkan folder","Mengulang perintah acak sampai berhasil","Menonaktifkan semua pengaturan keamanan"],a:0,why:"Pesan kesalahan dan aturan penulisan path memberi petunjuk penyebab. Spasi perlu ditangani sesuai sintaks shell, misalnya dengan tanda kutip bila sesuai."}
]},
{ id:6, page:'tp6', icon:'◉', title:'Keamanan, Backup, dan Pemulihan Data', short:'Melindungi file dengan hak akses, strategi backup, dan prosedur pemulihan.', duration:'45–60 menit', objectives:['Menjelaskan kerahasiaan, integritas, dan ketersediaan data.','Mengidentifikasi risiko hak akses dan kehilangan data.','Merancang strategi backup 3-2-1.','Menentukan langkah awal pemulihan dan troubleshooting.'], prompt:'Jika laptop rusak dan semua file hanya tersimpan di laptop tersebut, bagaimana kamu memulihkan tugas yang dibutuhkan besok?', sections:[
{title:'Prinsip CIA',body:'Kerahasiaan (confidentiality) berarti data hanya dapat diakses pihak yang berwenang. Integritas (integrity) berarti data terlindungi dari perubahan atau kerusakan yang tidak diinginkan. Ketersediaan (availability) berarti data dan layanan dapat diakses saat dibutuhkan.',sub:'Keamanan bukan hanya memasang kata sandi. Hak akses yang sesuai, pembaruan, kebiasaan pengguna, dan backup juga berperan.'},
{title:'Permission dan hak akses',body:'Sistem operasi dapat mengatur siapa yang boleh membaca, mengubah, menjalankan, atau mengelola file. Berikan akses seperlunya dan hindari membagikan file sensitif melalui tautan terbuka. Rincian izin berbeda antar-sistem dan layanan.',list:['Gunakan akun pribadi dan kunci perangkat.','Bagikan akses hanya kepada orang yang memerlukannya.','Periksa ulang izin tautan sebelum membagikan dokumen.','Jangan menyimpan kata sandi dalam file yang mudah diakses.']},
{title:'Strategi backup 3-2-1',body:'Strategi 3-2-1 secara umum berarti memiliki tiga salinan data, menggunakan dua jenis media penyimpanan, dan menyimpan satu salinan di lokasi berbeda/offsite. Strategi ini membantu mengurangi risiko satu kejadian merusak seluruh salinan.',sub:'Contoh: file kerja di laptop, salinan di drive eksternal, dan salinan terenkripsi pada lokasi cloud yang terpisah. Sesuaikan keamanan, biaya, kapasitas, serta kebijakan organisasi.'},
{title:'Backup bukan selalu sinkronisasi',body:'Sinkronisasi menjaga isi beberapa lokasi tetap selaras. Jika file terhapus atau terenkripsi lalu perubahan tersinkron, salinan lain bisa ikut terdampak. Backup yang baik memiliki riwayat versi atau salinan yang terisolasi sesuai kebutuhan, dan proses pemulihannya diuji.',sub:'Jangan menganggap file aman hanya karena terlihat di dua perangkat. Pastikan salinan benar-benar dapat dipulihkan.'},
{title:'Pemulihan dan troubleshooting',body:'Jika file hilang, hentikan tindakan yang berpotensi menimpa data, periksa tempat sampah, lokasi asal, riwayat versi, dan backup yang tersedia. Untuk media yang rusak atau data yang sangat penting, hindari eksperimen berulang dan cari bantuan yang kompeten.',list:['Catat apa yang terjadi dan kapan.','Periksa lokasi, nama, filter pencarian, dan akun yang digunakan.','Periksa Recycle Bin/Trash serta riwayat versi jika tersedia.','Pulihkan dari backup yang diketahui baik.','Setelah pulih, periksa integritas file dan dokumentasikan penyebab.']}
], activity:'Gunakan simulasi Backup Planner. Tentukan lokasi salinan utama, salinan kedua, lokasi offsite, dan frekuensi backup. Jelaskan risiko yang masih tersisa dan cara menguji pemulihan.',group:'Analisis kasus: komputer sekolah terkena ransomware, folder tugas tersinkron ke cloud, dan backup eksternal terakhir dilakukan dua minggu lalu. Buat urutan respons aman, identifikasi pihak yang perlu dihubungi, dan jelaskan mengapa sinkronisasi saja belum tentu cukup.',quiz:[
{q:"Laptop seorang siswa terinfeksi ransomware dan folder tugas tersinkron ke cloud. Backup eksternal terakhir dibuat dua minggu lalu. Urutan respons awal yang paling aman adalah …",opts:["Terus menyinkronkan file agar semua perangkat mendapat versi terbaru","Memutus koneksi jaringan bila aman, melapor kepada penanggung jawab TI, dan menghindari penggunaan backup sebelum kondisinya dinilai","Menghapus semua backup karena pasti sudah rusak","Mengganti nama file terenkripsi lalu menganggap masalah selesai"],a:1,why:"Mengurangi koneksi dapat membantu membatasi penyebaran, dan pelaporan kepada penanggung jawab TI memungkinkan penanganan terkoordinasi. Backup harus dinilai sebelum dipulihkan."},
{q:"Sekolah memiliki tiga salinan data, tetapi semuanya berada pada tiga folder di SSD eksternal yang sama. Jika SSD rusak, semua salinan dapat hilang sekaligus. Evaluasi terbaik adalah …",opts:["Strategi itu sudah memadai karena jumlah file mencapai tiga","Salinan belum cukup terpisah; perlu mempertimbangkan media berbeda dan satu salinan di lokasi lain","Cukup mengganti nama setiap folder menjadi backup","Risiko hanya dapat dikurangi dengan membuat kata sandi lebih panjang"],a:1,why:"Tiga folder pada satu perangkat bukan tiga salinan yang tahan terhadap kegagalan perangkat yang sama. Strategi 3-2-1 mempertimbangkan jenis media dan lokasi terpisah."},
{q:"Seorang siswa menghapus file secara tidak sengaja. Ia ingin memaksimalkan peluang pemulihan. Langkah awal yang paling tepat adalah …",opts:["Menyimpan banyak file baru ke drive yang sama tanpa pemeriksaan","Memeriksa Trash/Recycle Bin, lokasi asal, riwayat versi, dan backup; hindari tindakan yang dapat menimpa data","Memformat drive agar sistem membuat file baru","Menganggap file sinkron pasti bisa dipulihkan"],a:1,why:"Pemeriksaan tempat sampah, riwayat versi, dan backup adalah langkah awal yang relevan; mengurangi penulisan baru dapat membantu menghindari penimpaan data pada kondisi tertentu."}
]}
];
const DEEP_CONTENT = {
1:[
{title:'Sistem operasi sebagai pengelola sumber daya',body:'Komputer memiliki sumber daya yang terbatas: waktu pemrosesan CPU, kapasitas RAM, ruang penyimpanan, serta perangkat seperti layar, keyboard, kamera, dan jaringan. Sistem operasi (Operating System/OS) mengoordinasikan penggunaan sumber daya tersebut agar banyak aplikasi dapat bekerja tanpa mengambil alih perangkat secara sembarangan. Ketika dua aplikasi membutuhkan CPU, OS mengatur giliran; ketika aplikasi membutuhkan memori, OS mengalokasikan ruang dan menjaga batas akses; ketika aplikasi menyimpan dokumen, OS menyediakan layanan untuk menulis data ke sistem file.',list:['Pengelolaan sumber daya berarti membagikan dan mengawasi penggunaan komponen komputer.','Abstraksi berarti menyajikan cara penggunaan yang lebih sederhana daripada detail perangkat keras.','Isolasi berarti membantu membatasi dampak atau akses satu proses terhadap proses lain.','Layanan sistem adalah fungsi yang dapat diminta aplikasi, misalnya membuka file atau menggunakan jaringan.'],sub:'Analogi: OS seperti pengelola laboratorium. Pengelola tidak mengerjakan semua tugas siswa, tetapi mengatur jadwal, akses alat, dan aturan pemakaian agar kegiatan berlangsung tertib.'},
{title:'Kernel, antarmuka, dan layanan sistem',body:'Kernel adalah bagian inti sistem operasi yang berhubungan erat dengan pengelolaan CPU, memori, perangkat, dan mekanisme akses. Di atasnya terdapat berbagai komponen dan layanan sistem yang membantu pekerjaan seperti jaringan, pencetakan, akun, dan penyimpanan. Antarmuka pengguna adalah cara seseorang memberi instruksi dan menerima hasil. Pada GUI, pengguna berinteraksi melalui jendela, ikon, menu, tombol, dan pointer. Pada CLI, pengguna mengetik perintah. Antarmuka bukan keseluruhan OS; tampilan desktop hanyalah salah satu bagian yang terlihat.',list:['Kernel: inti OS yang menangani fungsi mendasar.','Shell: program atau lingkungan yang menerima perintah pengguna; dapat berbentuk CLI atau lingkungan lain.','GUI: antarmuka grafis yang memudahkan eksplorasi visual.','CLI: antarmuka teks yang berguna untuk perintah berulang, otomatisasi, dan administrasi.'],sub:'Istilah “shell” dan “terminal” tidak selalu sama: terminal adalah aplikasi/lingkungan untuk menampilkan sesi teks, sedangkan shell memproses perintah yang dimasukkan.'},
{title:'Apa yang terjadi saat aplikasi dijalankan?',body:'Saat pengguna membuka aplikasi, OS memuat bagian program dan data yang dibutuhkan ke memori, membuat atau memulai proses, menyediakan sumber daya, dan memberi waktu CPU sesuai kebijakan sistem. Jika aplikasi meminta membuka foto, aplikasi meminta layanan sistem untuk membaca file. OS memeriksa jalur dan hak akses, berinteraksi dengan sistem file dan perangkat penyimpanan, lalu menyediakan data kepada aplikasi. Ketika aplikasi menampilkan foto, sistem grafis dan driver perangkat ikut berperan. Detail urutan dan komponen dapat berbeda menurut OS dan jenis aplikasi.',list:['Masukan: klik, ketukan, atau perintah pengguna.','Permintaan: aplikasi meminta layanan OS melalui mekanisme yang tersedia.','Pemrosesan: OS mengatur sumber daya dan akses yang dibutuhkan.','Keluaran: hasil ditampilkan atau disimpan, atau pesan kesalahan diberikan jika operasi gagal.'],sub:'Diagram pembelajaran menyederhanakan jalur ini. Pada OS nyata, komunikasi dapat melibatkan banyak layanan, pustaka, driver, dan mekanisme keamanan.'},
{title:'Jenis perangkat, konteks, dan batas peran OS',body:'Sistem operasi hadir pada komputer desktop, laptop, ponsel, tablet, server, perangkat tertanam, dan perangkat khusus. Windows, macOS, dan distribusi Linux umum ditemukan pada komputer; Android dan iOS pada ponsel; perangkat lain dapat memakai sistem tertanam yang dirancang untuk tugas khusus. OS menyediakan fondasi, tetapi pengalaman juga dipengaruhi perangkat keras, aplikasi, pengaturan, versi, pembaruan, dan kebijakan pengelola.',list:['Perangkat keras adalah komponen fisik seperti CPU, RAM, SSD, layar, dan keyboard.','Perangkat lunak adalah instruksi/program yang dijalankan komputer.','Aplikasi dirancang untuk melakukan tugas pengguna, misalnya mengetik atau mengedit foto.','Firmware adalah perangkat lunak tingkat rendah yang tertanam pada perangkat dan membantu proses awal atau pengendalian perangkat.'],sub:'OS bukan jaminan bahwa semua aplikasi atau semua perangkat akan kompatibel. Kompatibilitas perlu diperiksa berdasarkan versi, arsitektur, driver, dan kebutuhan aplikasi.'}
],
2:[
{title:'Siklus hidup proses dan penjadwalan CPU',body:'Program adalah kumpulan instruksi yang tersimpan; proses adalah program yang sedang dijalankan beserta konteks dan sumber daya yang digunakan. Proses dapat berada dalam keadaan siap menunggu giliran CPU, berjalan, atau menunggu suatu kejadian seperti operasi penyimpanan selesai. Penjadwal (scheduler) menentukan proses atau thread yang memperoleh waktu CPU. Pada sistem multitasking, CPU dapat berpindah dengan cepat di antara pekerjaan sehingga pengguna merasa banyak aplikasi berjalan bersamaan. Pada prosesor multi-core, beberapa pekerjaan juga dapat benar-benar berjalan paralel.',list:['Process: instans program yang sedang berjalan.','Thread: alur eksekusi di dalam proses; satu proses dapat memiliki beberapa thread.','Scheduler: komponen OS yang memilih pekerjaan untuk memperoleh CPU.','Context switch: perpindahan CPU dari satu proses/thread ke proses/thread lain dengan menyimpan dan memulihkan konteks yang diperlukan.'],sub:'Simulasi kelas hanya menunjukkan konsep antrean. OS nyata memakai kebijakan penjadwalan yang lebih kompleks dan dapat dipengaruhi prioritas, jumlah inti CPU, I/O, dan banyak faktor lain.'},
{title:'RAM, memori virtual, dan dampak pada kinerja',body:'RAM (Random Access Memory) adalah memori kerja cepat yang digunakan untuk menyimpan instruksi dan data yang sedang aktif. OS mengatur ruang memori agar proses dapat bekerja dan membatasi akses yang tidak sah. Memori virtual adalah mekanisme pengelolaan alamat memori yang memungkinkan sistem memberi ruang alamat terisolasi kepada proses; pada banyak sistem, sebagian halaman yang jarang dipakai dapat dipindahkan sementara ke penyimpanan. Penyimpanan jauh lebih lambat daripada RAM, sehingga aktivitas pemindahan berlebihan dapat membuat sistem terasa lambat.',list:['Kapasitas RAM memengaruhi jumlah data aktif yang dapat ditangani dengan nyaman.','Beban memori adalah seberapa banyak memori yang sedang digunakan atau diminta.','Paging adalah mekanisme mengelola memori dalam unit halaman; detail implementasinya berbeda.','Kinerja juga dipengaruhi CPU, kecepatan penyimpanan, aplikasi, suhu, dan proses latar belakang.'],sub:'Jangan menyamakan memori virtual dengan RAM tambahan yang sama cepatnya. Menutup aplikasi yang tidak dibutuhkan dapat membantu, tetapi hindari menghentikan proses sistem yang tidak dipahami.'},
{title:'Input/output, sistem file, dan driver',body:'Input/output (I/O) adalah pertukaran data antara komputer dan perangkat atau layanan. Keyboard, mouse, mikrofon, kamera, dan pemindai merupakan contoh perangkat input; layar, speaker, dan printer merupakan contoh output. SSD, HDD, dan flash drive menyimpan data. Driver adalah perangkat lunak yang membantu OS berkomunikasi dengan perangkat tertentu. Sistem file mengatur cara data disusun sebagai file dan direktori serta bagaimana nama, lokasi, dan atributnya ditemukan. OS dapat mengantrekan operasi I/O sehingga CPU tidak harus menunggu secara aktif pada setiap operasi.',list:['Buffer: area sementara untuk menampung data saat dipindahkan.','Driver: komponen perangkat lunak yang membantu mengendalikan atau berkomunikasi dengan perangkat.','Sistem file: aturan dan struktur untuk menyimpan serta menemukan data.','Perangkat eksternal: perangkat yang terhubung dari luar, misalnya printer atau flash drive.'],sub:'Jika printer tidak berfungsi, penyebabnya bisa berupa daya, kabel/jaringan, antrean cetak, driver, izin, atau aplikasi. Jangan langsung menyimpulkan OS rusak.'},
{title:'Booting: dari daya menyala sampai siap digunakan',body:'Booting adalah proses memulai sistem. Secara umum, setelah perangkat dinyalakan, firmware seperti BIOS atau UEFI melakukan inisialisasi dan pemeriksaan dasar, lalu memilih perangkat boot. Bootloader kemudian membantu memuat kernel. Kernel menginisialisasi komponen penting, sistem memulai layanan, dan antarmuka login atau lingkungan pengguna ditampilkan. Urutan rinci berbeda antara komputer, ponsel, dan perangkat lain; sistem modern juga dapat menggunakan mekanisme keamanan seperti secure boot.',list:['Firmware: perangkat lunak tingkat rendah yang tersimpan pada perangkat.','BIOS/UEFI: jenis firmware yang membantu inisialisasi dan proses boot pada banyak PC.','Bootloader: komponen yang membantu memilih dan memuat OS.','Kernel: inti OS yang mulai mengelola sumber daya sistem.','Layanan sistem: proses latar belakang yang mendukung fungsi OS.'],sub:'Booting tidak sama dengan membuka aplikasi. Booting menyiapkan sistem operasi; menjalankan aplikasi terjadi setelah lingkungan sistem tersedia.'},
{title:'GUI, CLI, dan pemecahan masalah yang sistematis',body:'GUI sesuai untuk eksplorasi visual dan tugas yang mudah dilakukan lewat menu. CLI bermanfaat ketika perintah harus diulang, banyak file perlu diproses, atau instruksi teknis perlu dicatat secara presisi. Troubleshooting (pemecahan masalah) adalah proses mencari penyebab gangguan secara teratur, bukan menebak atau mengubah banyak pengaturan sekaligus. Mulailah dengan mengamati gejala, mencatat pesan, memeriksa hal sederhana, menguji satu perubahan, lalu menilai hasilnya.',list:['Gejala: hal yang diamati, misalnya aplikasi tidak merespons.','Hipotesis: dugaan penyebab yang akan diuji.','Langkah aman: tindakan yang risikonya kecil dan dapat dibatalkan.','Dokumentasi: catatan gejala, tindakan, dan hasil yang membantu penanganan berikutnya.'],sub:'Sebelum memulai ulang atau menutup paksa aplikasi, simpan pekerjaan jika memungkinkan. Untuk masalah data penting, enkripsi, atau kerusakan perangkat keras, minta bantuan yang kompeten.'}
],
3:[
{title:'Cara membandingkan OS secara adil',body:'Perbandingan sistem operasi harus menggunakan kriteria yang relevan terhadap kebutuhan. Satu sistem mungkin unggul dalam kompatibilitas aplikasi tertentu, sementara sistem lain cocok untuk pembelajaran pemrograman, perangkat dengan sumber daya terbatas, atau pengelolaan terpusat. Bedakan fakta teknis dari preferensi pribadi. Periksa versi yang dibandingkan, sebab fitur dan dukungan dapat berubah seiring pembaruan.',list:['Kompatibilitas: apakah aplikasi dan perangkat yang diperlukan didukung?','Usability/kegunaan: seberapa mudah sistem dipelajari dan dipakai untuk tugas tersebut?','Pemeliharaan: seberapa mudah pembaruan, pemantauan, dan pemecahan masalah dilakukan?','Total biaya: lisensi, perangkat, pelatihan, dukungan, dan waktu pengelolaan.','Aksesibilitas: apakah sistem mendukung kebutuhan pengguna yang beragam?'],sub:'Hindari klaim mutlak seperti “OS ini selalu paling aman” atau “OS itu selalu lebih cepat”. Keamanan dan kinerja bergantung pada versi, konfigurasi, perangkat, kebiasaan pengguna, serta beban kerja.'},
{title:'Windows dan macOS',body:'Windows banyak digunakan di PC dan laptop dari berbagai produsen, sehingga pilihan perangkat dan aplikasi cukup luas. Kecocokan aplikasi bisnis, pendidikan, dan permainan perlu diperiksa terhadap versi dan spesifikasi. macOS dirancang untuk komputer Mac dan terintegrasi erat dengan perangkat keras serta ekosistem Apple. Integrasi dapat memudahkan alur kerja tertentu, tetapi pilihan perangkat keras dan kebijakan lisensinya berbeda dari PC yang memakai Windows. Keduanya memiliki alat keamanan, pembaruan, akun, dan manajemen file; pengaturan yang tepat tetap penting.',list:['Periksa persyaratan aplikasi sebelum memilih perangkat.','Bandingkan umur dukungan OS dan kebijakan pembaruan.','Pertimbangkan layanan yang sudah dipakai sekolah atau organisasi.','Periksa kebutuhan aksesori dan driver khusus.']},
{title:'Linux, Android, dan iOS',body:'Linux sering merujuk pada kernel Linux atau, dalam penggunaan umum, distribusi yang menggabungkan kernel dengan alat sistem, aplikasi, dan pengelola paket. Distribusi Linux banyak digunakan pada server, pengembangan perangkat lunak, pendidikan, dan juga desktop. Android dibangun di atas kernel Linux dengan platform dan ekosistem aplikasi seluler tersendiri. iOS dirancang untuk iPhone dan dikelola dalam ekosistem Apple. OS seluler memberi perhatian besar pada izin aplikasi, penggunaan baterai, sensor, distribusi aplikasi, dan pengalaman layar sentuh.',list:['Distribusi Linux: kumpulan kernel, komponen sistem, aplikasi, dan kebijakan pemeliharaan yang dikemas bersama.','Ekosistem: hubungan antara perangkat, aplikasi, akun, layanan, dan dukungan.','Pembaruan keamanan: perbaikan untuk mengurangi kerentanan yang diketahui.','Izin aplikasi: aturan tentang akses aplikasi ke data atau fitur perangkat.'],sub:'“Linux” bukan satu tampilan atau satu paket aplikasi yang seragam. Pengalaman bergantung pada distribusi dan lingkungan desktop yang dipilih.'},
{title:'Membuat rekomendasi berdasarkan skenario',body:'Untuk memilih OS bagi laboratorium sekolah, pertimbangkan aplikasi yang dibutuhkan guru, kompatibilitas perangkat, anggaran, kemampuan teknisi, aksesibilitas, serta kebijakan keamanan. Untuk komputer pengembangan, pertimbangkan alat pemrograman, terminal, lingkungan uji, dan kebutuhan deployment. Untuk pengguna umum, kemudahan, dukungan aplikasi, pembaruan, dan layanan bantuan bisa lebih penting. Rekomendasi yang baik menyatakan asumsi dan kompromi, bukan hanya menyebut nama OS.',list:['Tuliskan kebutuhan wajib dan kebutuhan tambahan.','Tentukan kriteria yang paling penting.','Bandingkan minimal dua pilihan dengan bukti atau dokumentasi.','Sebutkan kompromi, risiko, dan hal yang masih perlu diuji.','Evaluasi ulang jika kebutuhan atau versi perangkat berubah.'],sub:'Kriteria pemilihan adalah alat pengambilan keputusan. Hasilnya dapat berbeda untuk dua pengguna yang mempunyai kebutuhan berbeda.'}
],
4:[
{title:'File, folder, dan sistem file',body:'File adalah unit data yang disimpan dan dikenali melalui nama serta atributnya; isi file dapat berupa teks, gambar, audio, video, program, atau data lain. Folder (direktori) adalah wadah logis untuk mengelompokkan file dan subfolder. Sistem file menentukan bagaimana data dan metadata disusun serta ditemukan pada media penyimpanan. Struktur bertingkat memudahkan pengguna memisahkan tugas, mata pelajaran, tanggal, versi, atau jenis dokumen. Folder biasanya tidak “berisi” data seperti file biasa, melainkan merujuk pada entri dan hubungan di dalam struktur sistem file.',list:['Direktori akar/root: titik awal struktur pada suatu volume atau sistem file.','Subfolder: folder yang berada di dalam folder lain.','Volume: bagian penyimpanan yang disajikan sebagai unit logis, misalnya drive.','Sistem file: metode/struktur seperti NTFS, exFAT, APFS, atau ext4; dukungan bergantung pada OS dan perangkat.'],sub:'Nama drive dan format sistem file bukan hal yang sama. Huruf drive seperti C: umum di Windows, sedangkan sistem mirip Unix sering menggunakan satu pohon direktori dengan titik mount.'},
{title:'Path absolut dan relatif',body:'Path atau jalur menunjukkan lokasi file atau direktori. Path absolut menyatakan lokasi dari titik acuan utama yang ditentukan sistem. Contoh Windows: C:\\\\Users\\\\Siswa\\\\Documents\\\\Laporan.docx. Contoh Linux: /home/siswa/dokumen/laporan.txt. Path relatif ditafsirkan dari direktori kerja atau lokasi acuan saat ini, misalnya tugas/laporan.txt. Karena bergantung pada lokasi acuan, path relatif dapat menunjuk ke lokasi berbeda ketika direktori kerja berubah.',list:['Direktori kerja saat ini: folder yang menjadi acuan perintah relatif.','Pemisah jalur: karakter yang memisahkan nama direktori; berbeda antar-sistem.','. (titik): sering merujuk ke direktori saat ini dalam CLI.','.. (dua titik): sering merujuk ke direktori induk dalam CLI.'],sub:'Path harus ditulis sesuai sistem dan lokasi nyata. Perbedaan huruf besar/kecil dapat berpengaruh pada sebagian sistem file, khususnya banyak konfigurasi Linux.'},
{title:'Ekstensi, format, dan asosiasi aplikasi',body:'Ekstensi adalah bagian akhir nama file setelah titik, seperti .pdf, .jpg, .mp3, .mp4, .zip, atau .txt. Ekstensi sering memberi petunjuk tentang format dan aplikasi yang dapat membukanya, tetapi bukan bukti mutlak isi file. Mengganti nama ekstensi tidak otomatis mengonversi data. Misalnya, mengganti nama gambar.png menjadi gambar.pdf tidak mengubah isi gambar menjadi dokumen PDF yang valid. Format file menentukan cara data dikodekan dan diinterpretasikan.',list:['.txt: teks sederhana.','.docx / .odt: dokumen pengolah kata dengan format berbeda.','.jpg / .png: format gambar dengan karakteristik kompresi dan transparansi berbeda.','.mp3 / .wav: format audio dengan sifat ukuran dan kualitas berbeda.','.mp4: wadah multimedia yang dapat memuat video, audio, dan data terkait.','.zip: arsip yang menggabungkan berkas dan dapat menerapkan kompresi.'],sub:'Jangan membuka lampiran yang tidak dikenal hanya karena ekstensi terlihat aman. Perhatikan sumber, jenis file, dan peringatan keamanan.'},
{title:'Metadata dan penamaan yang konsisten',body:'Metadata adalah informasi tentang file, misalnya ukuran, waktu dibuat atau diubah, pemilik, hak akses, jenis file, dan lokasi. Atribut yang tersedia bergantung pada sistem file dan aplikasi. Metadata membantu pencarian dan pengelolaan, tetapi beberapa waktu atau atribut dapat berubah saat file disalin atau diunduh. Nama file yang baik ringkas, bermakna, konsisten, dan mudah dicari. Untuk pekerjaan sekolah, pola seperti 2026-10-27_KelasXI_LKPD-OS_v01.docx memberi petunjuk tanggal, konteks, dan versi.',list:['Gunakan kata kunci yang mudah dicari.','Hindari nama samar seperti baru, final-banget, atau dokumen1 untuk file penting.','Gunakan format tanggal yang konsisten, misalnya YYYY-MM-DD.','Bedakan versi secara jelas dan hindari banyak file dengan nama final yang membingungkan.','Jangan gunakan karakter yang dilarang sistem atau aplikasi tujuan.'],sub:'Metadata tidak selalu dapat dipercaya sebagai bukti asal-usul karena dapat berubah. Untuk tugas resmi, ikuti aturan penamaan dari guru atau organisasi.'},
{title:'Merancang struktur direktori yang mudah dipelihara',body:'Struktur direktori yang baik mengikuti cara kerja pengguna, bukan sekadar membuat sebanyak mungkin folder. Mulailah dengan kategori utama, lalu pecah menurut proyek, mata pelajaran, periode, atau jenis dokumen jika memang membantu. Hindari struktur terlalu dalam karena file menjadi sulit ditemukan. Pastikan anggota kelompok memahami aturan yang sama dan tentukan lokasi untuk bahan mentah, hasil akhir, aset, dan dokumentasi.',list:['Pisahkan bahan sumber, file kerja, dan hasil final jika alur proyek membutuhkannya.','Gunakan nama folder yang spesifik dan konsisten.','Hindari duplikasi yang tidak perlu; jika ada salinan, jelaskan tujuan atau versinya.','Uji struktur dengan meminta orang lain mencari file tertentu tanpa bantuan.'],sub:'Struktur yang baik diukur dari kemudahan menemukan, memahami, memelihara, dan mencadangkan file—bukan dari banyaknya folder.'}
],
5:[
{title:'Memilih GUI atau CLI dengan tepat',body:'GUI (Graphical User Interface) memungkinkan pengguna berinteraksi lewat jendela, menu, ikon, dan pointer. GUI cocok untuk melihat struktur folder, memeriksa pratinjau, dan melakukan tugas visual. CLI (Command-Line Interface) menerima perintah teks dan dapat lebih efisien untuk operasi berulang, administrasi, atau instruksi yang perlu dicatat. Keduanya bukan lawan mutlak: pengguna dapat memakai GUI untuk menemukan lokasi lalu menggunakan CLI untuk operasi terarah. Pilihan metode harus mempertimbangkan kejelasan, risiko, keterampilan, dan kebutuhan pengulangan.',list:['GUI: umumnya mudah dipelajari dan memberi konteks visual.','CLI: presisi dan dapat dirangkai, tetapi salah ketik atau salah path dapat berdampak besar.','Path: pastikan lokasi asal dan tujuan sebelum menjalankan perintah.','Validasi: periksa hasil setelah operasi, bukan hanya menganggap perintah berhasil.'],sub:'Perintah dalam web app ini dijalankan oleh mesin simulasi terbatas. Tidak ada perintah yang diteruskan ke shell perangkat atau server.'},
{title:'Operasi file dan dampaknya',body:'Membuat folder menambah tempat pengelompokan. Menyalin file menghasilkan salinan tambahan sehingga file asal tetap ada. Memindahkan file mengubah lokasi file yang sama dan dapat membuat aplikasi atau tautan yang mengandalkan lokasi lama tidak lagi menemukannya. Mengganti nama mengubah nama entri, bukan otomatis mengubah format atau isi file. Menghapus file menghilangkannya dari lokasi aktif; pemulihan tidak selalu terjamin, terutama jika data sudah ditimpa atau media mengalami kerusakan.',list:['Copy/salin: sumber biasanya tetap ada dan tujuan mendapat salinan.','Move/pindah: file berpindah lokasi; perilaku teknis dapat berbeda antar-volume.','Rename/ganti nama: mengubah nama file atau folder.','Delete/hapus: menghapus entri atau menandai ruang sebagai dapat digunakan kembali; mekanisme berbeda menurut sistem.','Search/cari: gunakan nama, ekstensi, lokasi, tanggal, atau kata kunci sesuai fitur yang tersedia.'],sub:'Sebelum menghapus atau memindahkan banyak file, lakukan pemeriksaan nama dan lokasi. Untuk data penting, pastikan backup tersedia dan dapat dibuka.'},
{title:'Membaca perintah Windows CMD',body:'Di Command Prompt Windows, dir menampilkan isi direktori, cd berpindah direktori, mkdir membuat direktori, copy menyalin file, move memindahkan file, dan ren mengganti nama. Perintah bekerja berdasarkan lokasi saat ini atau path yang ditulis. Spasi pada nama folder dapat memerlukan tanda kutip. Perilaku dan opsi bisa berbeda pada PowerShell atau terminal lain, sehingga jangan mencampur sintaks tanpa memeriksa lingkungan.',list:['dir — menampilkan file dan folder di lokasi saat ini.','cd nama_folder — berpindah ke folder; cd .. naik ke direktori induk.','mkdir Tugas — membuat folder bernama Tugas.','copy sumber.txt tujuan.txt — menyalin file ke nama/lokasi tujuan.','move sumber.txt Tugas\\\\ — memindahkan file ke folder tujuan jika path sesuai.','ren lama.txt baru.txt — mengganti nama file.'],sub:'Contoh ini ditujukan untuk lingkungan latihan. Periksa direktori kerja dan path sebelum menggunakan perintah pada komputer sungguhan.'},
{title:'Membaca perintah Linux',body:'Pada banyak shell Linux, pwd menampilkan direktori kerja, ls menampilkan isi direktori, cd berpindah lokasi, mkdir membuat direktori, cp menyalin, dan mv memindahkan atau mengganti nama. Penulisan path absolut sering dimulai dari /. Nama file dengan spasi biasanya perlu dikutip atau di-escape. Perintah dapat memiliki opsi yang memengaruhi perilaku; pelajari opsi sebelum menggunakannya pada data penting.',list:['pwd — menampilkan direktori kerja saat ini.','ls — menampilkan isi direktori; opsi dapat mengubah detail tampilan.','cd dokumen — berpindah ke direktori dokumen jika tersedia.','mkdir tugas — membuat direktori tugas.','cp laporan.txt backup/ — menyalin file ke direktori backup jika tersedia.','mv draft.txt final.txt — mengganti nama; mv draft.txt tugas/ dapat memindahkan file.'],sub:'Di Linux, huruf besar dan kecil pada nama file biasanya dibedakan. Nama Laporan.txt dan laporan.txt dapat dianggap sebagai dua nama berbeda.'},
{title:'Kesalahan umum dan kebiasaan aman',body:'Kesalahan paling sering adalah bekerja pada direktori yang salah, salah mengeja nama, lupa tanda kutip untuk nama yang mengandung spasi, mengira copy sama dengan move, atau menghapus file tanpa memeriksa hasil pencarian. Kebiasaan yang baik adalah memulai dari direktori latihan, memakai nama file contoh, memeriksa perintah dan tujuan, menjalankan satu operasi pada satu waktu, lalu memvalidasi hasil dengan melihat struktur direktori.',list:['Baca perintah dari kiri ke kanan dan identifikasi sumber serta tujuan.','Gunakan folder latihan yang tidak berisi dokumen penting.','Periksa hasil menggunakan dir atau ls.','Jangan menyalin perintah berisiko dari internet tanpa memahami dampaknya.','Hindari perintah penghapusan rekursif atau perintah dengan hak administrator jika tidak benar-benar diperlukan.'],sub:'Simulator ini sengaja mendukung subset perintah. Perintah yang belum didukung harus ditolak dengan pesan yang jelas, bukan dijalankan secara bebas.'}
],
6:[
{title:'Prinsip CIA: kerahasiaan, integritas, ketersediaan',body:'Keamanan informasi sering dijelaskan melalui tiga tujuan. Kerahasiaan (confidentiality) memastikan data hanya dilihat pihak yang berwenang. Integritas (integrity) menjaga data tetap benar dan tidak berubah tanpa izin. Ketersediaan (availability) memastikan data atau layanan dapat digunakan saat diperlukan. Ketiganya saling terkait: dokumen yang rahasia tetapi tidak bisa dibuka pemiliknya mengalami masalah ketersediaan; file yang mudah diakses tetapi diubah tanpa izin mengalami masalah integritas.',list:['Kerahasiaan: gunakan akun, izin, enkripsi, dan pembagian akses yang sesuai.','Integritas: batasi hak ubah, simpan versi, dan periksa hasil setelah pemulihan.','Ketersediaan: siapkan backup, perangkat yang terawat, dan prosedur pemulihan.'],sub:'Keamanan bukan hanya antivirus atau kata sandi. Kebiasaan berbagi file, pembaruan, izin, backup, dan kesiapan menghadapi insiden sama-sama penting.'},
{title:'Permission, akun, dan prinsip hak minimum',body:'Permission atau izin menentukan tindakan yang boleh dilakukan terhadap file atau sumber daya. Contoh tindakan meliputi membaca, menulis/mengubah, menjalankan, dan mengelola izin. Akun administrator biasanya memiliki kewenangan lebih luas daripada akun standar. Prinsip hak minimum berarti seseorang atau aplikasi hanya diberi izin yang dibutuhkan untuk tugasnya. Ini mengurangi dampak salah klik, aplikasi berbahaya, atau perubahan yang tidak disengaja.',list:['Read/baca: melihat isi file.','Write/tulis: membuat atau mengubah isi.','Execute/jalankan: menjalankan file program atau memasuki direktori sesuai aturan OS.','Owner/pemilik: identitas yang memiliki hubungan pengelolaan terhadap objek pada sistem tertentu.','Administrator: akun atau peran dengan kewenangan administratif yang luas.'],sub:'Jangan membagikan tautan dengan akses edit kepada semua orang jika mereka hanya perlu membaca. Periksa kembali izin sebelum dan setelah membagikan dokumen.'},
{title:'Backup 3-2-1 dan jenis salinan',body:'Backup adalah salinan data yang dipersiapkan untuk pemulihan jika data utama hilang, rusak, terhapus, atau tidak dapat diakses. Panduan 3-2-1 menyarankan tiga salinan data, dua jenis media penyimpanan, dan satu salinan di lokasi berbeda. “Jenis media” tidak selalu berarti tiga perangkat berbeda; tujuan utamanya mengurangi titik kegagalan yang sama. Salinan offsite dapat berupa penyimpanan di lokasi fisik lain atau layanan jarak jauh dengan pengamanan yang sesuai.',list:['Salinan utama: file aktif yang sedang digunakan.','Salinan kedua: backup pada media berbeda, misalnya drive eksternal.','Salinan offsite: salinan terpisah dari lokasi utama untuk menghadapi pencurian, kebakaran, atau bencana lokal.','Versioning/riwayat versi: menyimpan beberapa keadaan file dari waktu berbeda.','Restore/pemulihan: mengembalikan data dari backup ke lokasi yang dapat digunakan.'],sub:'Strategi 3-2-1 adalah panduan umum, bukan jaminan mutlak. Pertimbangkan enkripsi, akses akun, biaya, kapasitas, frekuensi, dan uji pemulihan.'},
{title:'Backup, sinkronisasi, arsip, dan versi',body:'Sinkronisasi menjaga data di beberapa lokasi agar selaras; perubahan atau penghapusan pada satu lokasi dapat diterapkan ke lokasi lain. Backup ditujukan untuk memungkinkan pemulihan dari keadaan sebelumnya. Arsip biasanya menggabungkan beberapa file menjadi satu paket, sering dengan kompresi, tetapi arsip tidak otomatis menjadi backup jika hanya ada satu salinan. Riwayat versi membantu mengembalikan keadaan terdahulu, tetapi ketersediaan dan lama penyimpanannya bergantung pada layanan.',list:['Sync/sinkronisasi: menjaga salinan agar serupa atau mutakhir.','Backup: salinan yang dirancang untuk pemulihan.','Archive/arsip: paket berisi satu atau banyak file, misalnya ZIP.','Compression/kompresi: mengurangi ukuran data dengan metode tertentu.','Versioning: menyimpan beberapa versi dari file atau data.'],sub:'Contoh risiko: file terhapus lalu penghapusan tersinkron ke perangkat lain. Backup berversi atau salinan offline yang terpisah dapat memberi jalur pemulihan tambahan.'},
{title:'Respons kehilangan data dan uji pemulihan',body:'Ketika file hilang, jangan langsung menginstal banyak aplikasi pemulihan atau menulis data baru ke media yang diduga rusak. Tindakan baru dapat menimpa data yang masih mungkin dipulihkan. Periksa lokasi dan akun yang benar, filter pencarian, Recycle Bin/Trash, riwayat versi, dan backup. Jika ada dugaan ransomware atau kompromi akun, putuskan koneksi sesuai prosedur organisasi, laporkan kepada pihak yang berwenang, dan jangan menyambungkan backup sebelum risiko dipahami.',list:['Identifikasi gejala, waktu kejadian, file yang terdampak, dan perubahan terakhir.','Periksa lokasi, nama, akun, filter, dan tempat sampah.','Periksa backup atau riwayat versi yang diketahui baik.','Pulihkan ke lokasi terpisah bila memungkinkan, lalu verifikasi isi file.','Catat penyebab, tindakan, hasil, dan langkah pencegahan agar insiden tidak berulang.'],sub:'Backup yang belum pernah diuji belum tentu dapat dipulihkan. Lakukan uji restore berkala pada salinan yang aman dan pastikan orang yang bertanggung jawab mengetahui prosedurnya.'}
]
};

const GLOSSARY=[
['Sistem operasi','Perangkat lunak sistem yang mengelola sumber daya dan menyediakan layanan untuk aplikasi.'],['Kernel','Bagian inti OS yang mengelola fungsi dasar sistem dan akses ke sumber daya.'],['Driver','Perangkat lunak yang membantu OS berkomunikasi dengan perangkat.'],['Proses','Program yang sedang berjalan beserta keadaan dan sumber dayanya.'],['Thread','Unit eksekusi di dalam suatu proses.'],['Multitasking','Kemampuan sistem mengelola beberapa tugas secara bergantian atau paralel.'],['RAM','Memori kerja untuk data dan instruksi yang sedang digunakan.'],['Memori virtual','Mekanisme pengelolaan ruang alamat yang dapat memanfaatkan penyimpanan sebagai dukungan memori.'],['GUI','Antarmuka grafis dengan jendela, ikon, menu, dan pointer.'],['CLI','Antarmuka untuk memasukkan perintah berbasis teks.'],['File','Unit data yang disimpan dengan nama dan isi tertentu.'],['Folder/direktori','Wadah logis untuk mengelompokkan file dan direktori lain.'],['Path','Alamat atau jalur yang menunjukkan lokasi file atau direktori.'],['Ekstensi','Bagian nama file yang sering memberi petunjuk format.'],['Metadata','Informasi tentang file, seperti ukuran atau waktu modifikasi.'],['Sistem file','Metode untuk mengatur dan mengakses data pada media penyimpanan.'],['Permission','Aturan hak akses terhadap file atau sumber daya.'],['Backup','Salinan data untuk membantu pemulihan ketika data utama hilang atau rusak.'],['Sinkronisasi','Proses menjaga data di beberapa lokasi tetap selaras.'],['Kompresi','Proses mengurangi ukuran data dengan metode tertentu.'],['Arsip','Paket file yang dikumpulkan menjadi satu berkas, sering untuk penyimpanan atau distribusi.'],['Recovery','Proses memulihkan data atau keadaan sistem setelah kehilangan atau kerusakan.'],['Booting','Proses awal memulai sistem operasi setelah perangkat dinyalakan.'],['Path absolut','Jalur yang ditentukan dari titik acuan utama sistem file.'],['Path relatif','Jalur yang ditafsirkan berdasarkan direktori atau lokasi acuan.'],['3-2-1 backup','Panduan umum: tiga salinan, dua jenis media, satu salinan di lokasi berbeda.'],

['Aplikasi','Program yang dirancang untuk membantu pengguna melakukan tugas tertentu.'],
['Perangkat keras','Komponen fisik komputer, misalnya CPU, RAM, layar, dan SSD.'],
['Layanan sistem','Fungsi OS yang dapat digunakan oleh aplikasi atau komponen lain.'],
['CPU','Central Processing Unit; komponen yang mengeksekusi instruksi program.'],
['Penjadwal (scheduler)','Komponen yang menentukan proses atau thread mana yang memperoleh waktu CPU.'],
['Context switch','Perpindahan eksekusi CPU dari satu proses/thread ke proses/thread lain.'],
['Paging','Mekanisme pengelolaan memori menggunakan unit yang disebut halaman (page).'],

function loadState(){try{return Object.assign({visited:[],completed:[],quizScores:{},answers:{},notes:{},checks:{},last:'home',quizDone:[],files:null,simOS:['Windows','Linux']},JSON.parse(localStorage.getItem('dcl_state')||'{}'))}catch(e){return {visited:[],completed:[],quizScores:{},answers:{},notes:{},checks:{},last:'home',quizDone:[],simOS:['Windows','Linux']}}}

function go(page){if(!pageNames[page])page='home';state.last=page;if(page.startsWith('tp')){if(!state.visited.includes(page))state.visited.push(page)}save();render(page);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show');window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
document.getElementById('menuBtn').addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('scrim').classList.toggle('show')});document.getElementById('scrim').addEventListener('click',()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show')});
function render(page){document.getElementById('crumb').textContent='Workspace / '+(pageNames[page]||'Dashboard');const c=document.getElementById('content');if(page==='home')c.innerHTML=homeHTML();else if(page==='guide')c.innerHTML=guideHTML();else if(page.startsWith('tp'))c.innerHTML=lessonHTML(TP.find(x=>x.page===page)||TP[0]);else if(page==='lkpd')c.innerHTML=lkpdHTML();else if(page==='assessment')c.innerHTML=assessmentHTML();else if(page==='project')c.innerHTML=projectHTML();else if(page==='glossary')c.innerHTML=glossaryHTML();else if(page==='references')c.innerHTML=referencesHTML();attachPageHandlers(page);updateProgress()}

function introVideoHTML(id){const videos={1:{title:'Video Pengantar TP 01 · Sistem Operasi',desc:'Tonton video berikut sebagai pengantar sebelum mempelajari konsep dan simulasi.',videoId:'iLrYFx70snA'},3:{title:'Video Pengantar TP 03 · Memilih Sistem Operasi',desc:'Mulai dengan video ini, lalu lanjutkan ke materi perbandingan sistem operasi.',videoId:'rRFZ5hExKI8'}};const v=videos[id];if(!v)return '';const embedUrl='https://www.youtube-nocookie.com/embed/'+v.videoId+'?rel=0&playsinline=1';const isLocal=location.protocol==='content:'||location.protocol==='file:';const localNotice=isLocal?'<p class="muted smalltext">Catatan: agar pemutar tertanam dapat berjalan, buka aplikasi melalui alamat localhost atau hosting HTTPS. Membuka file langsung dari Downloads dapat menyebabkan YouTube Error 153.</p>':'';return `<section class="lesson-block intro-video-block"><div class="eyebrow">VIDEO PEMBELAJARAN</div><h2>${v.title}</h2><p>${v.desc}</p><div class="intro-video-frame"><iframe src="${embedUrl}" title="${v.title}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>${localNotice}</section>`;}

function lessonHTML(t){const complete=state.completed.includes(t.page);return `<div class="lesson-header"><div class="eyebrow">TUJUAN PEMBELAJARAN ${String(t.id).padStart(2,'0')} / 06</div><h1>${t.title}</h1><p class="muted">${t.short}</p><div class="lesson-meta"><span class="tag">◷ ${t.duration}</span><span class="tag">${complete?'✓ Sudah ditandai selesai':'◌ Dalam proses'}</span><span class="tag">⌘ Materi · Praktik · Kuis</span></div></div><div class="lesson-layout"><div class="lesson-main">${introVideoHTML(t.id)}<section class="lesson-block"><div class="eyebrow">LEARNING OBJECTIVES</div><h2>Setelah mempelajari bagian ini, kamu mampu…</h2><ol>${t.objectives.map(x=>`<li>${x}</li>`).join('')}</ol>${visualExplainerHTML(t.id)}<div class="callout"><strong>Pertanyaan pemantik</strong><br>${t.prompt}</div></section>${t.sections.map((s,i)=>`<section class="lesson-block"><div class="eyebrow">KONSEP ${String(i+1).padStart(2,'0')}</div><h2>${s.title}</h2><p>${s.body}</p>${s.list?`<ul>${s.list.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${s.sub?`<div class="callout">${s.sub}</div>`:''}${t.id===1&&i===2?layerDiagram():''}${t.id===2&&i===0?processSim():''}${t.id===3&&i===0?osCompare():''}${t.id===4&&i===0?directorySim():''}${t.id===5&&i===1?terminalSim():''}${t.id===5&&i===0?fileManagerSim():''}${t.id===6&&i===2?backupSim():''}</section>`).join('')}${(DEEP_CONTENT[t.id]||[]).map((s,i)=>`<section class="lesson-block deep-lesson"><div class="eyebrow">PENDALAMAN ${String(i+1).padStart(2,'0')} · PENJELASAN DETAIL</div><h2>${s.title}</h2><p>${s.body}</p>${s.list?`<ul>${s.list.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${s.sub?`<div class="callout"><strong>Catatan penting</strong><br>${s.sub}</div>`:''}</section>`).join('')}${termBankHTML(t.id)}<section class="lesson-block"><div class="eyebrow">INDIVIDUAL CHALLENGE</div><h2>Aktivitas individu</h2><p>${t.activity}</p><label class="smalltext muted" for="note-${t.id}">Catatan / hasil pengerjaan</label><textarea id="note-${t.id}" data-note="${t.page}" placeholder="Tuliskan hasil observasi, jawaban, atau kesimpulanmu...">${esc(state.notes[t.page]||'')}</textarea><div class="sim-controls"><button class="btn small primary" data-save-note="${t.page}">Simpan catatan</button><span class="muted smalltext">Catatan disimpan pada browser ini.</span></div></section><section class="lesson-block"><div class="eyebrow">COLLABORATION</div><h2>Aktivitas kelompok</h2><p>${t.group}</p><p class="muted smalltext">Diskusikan pembagian peran, catat sumber informasi, dan pastikan setiap anggota berkontribusi.</p></section><section class="lesson-block"><div class="eyebrow">FORMATIVE CHECK</div><h2>Kuis formatif</h2><p class="muted smalltext">Pilih jawaban terbaik untuk setiap pertanyaan. Setelah diperiksa, baca penjelasan dan ulangi jika diperlukan.</p><div id="quiz-${t.id}">${t.quiz.map((q,i)=>`<div class="quiz-q" data-question="${i}"><p>${i+1}. ${q.q}</p>${q.opts.map((o,j)=>`<label class="option"><input type="radio" name="q${t.id}-${i}" value="${j}"><span>${o}</span></label>`).join('')}<div class="feedback hide" id="fb-${t.id}-${i}"></div></div>`).join('')}</div><div class="actions"><button class="btn primary" data-check-quiz="${t.id}">Periksa jawaban</button><button class="btn" data-reset-quiz="${t.id}">Ulangi kuis</button></div><div id="score-${t.id}" class="detailbox">${state.quizScores[t.page]!==undefined?`Skor terakhir: ${state.quizScores[t.page]}/${t.quiz.length}`:'Skor akan muncul setelah jawaban diperiksa.'}</div></section><section class="lesson-block"><div class="eyebrow">WRAP UP</div><h2>Ringkasan & refleksi</h2><ul>${t.objectives.map(o=>`<li>${o}</li>`).join('')}</ul><label class="smalltext muted" for="reflection-${t.id}">Apa konsep yang paling kamu pahami? Apa yang masih ingin kamu tanyakan?</label><textarea id="reflection-${t.id}" data-note="reflection-${t.page}" placeholder="Tulis refleksi singkat...">${esc(state.notes['reflection-'+t.page]||'')}</textarea><div class="actions"><button class="btn small" data-save-note="reflection-${t.page}">Simpan refleksi</button><button class="btn primary" data-complete="${t.page}">${complete?'✓ Sudah selesai — batalkan':'Tandai TP selesai ✓'}</button></div></section><div class="footer-nav"><button class="btn" onclick="go('${t.id===1?'home':TP[t.id-2].page}')">← Sebelumnya</button><button class="btn primary" onclick="go('${t.id===6?'assessment':TP[t.id].page}')">${t.id===6?'Lanjut ke asesmen':'TP berikutnya →'}</button></div></div><aside class="lesson-aside"><div class="panel"><div class="eyebrow">ON THIS PAGE</div><h3>Ringkasan TP</h3><div class="bar"><span style="width:${complete?100:state.visited.includes(t.page)?30:0}%"></span></div><p class="muted smalltext">${t.objectives.length} target kompetensi · ${t.sections.length} bagian materi · ${t.quiz.length} soal formatif</p><div class="activity-row"><div class="mini-icon">1</div><div><strong>Pelajari konsep</strong><small>Baca penjelasan dan contoh.</small></div></div><div class="activity-row"><div class="mini-icon">2</div><div><strong>Coba simulasi</strong><small>Ubah nilai dan amati hasilnya.</small></div></div><div class="activity-row"><div class="mini-icon">3</div><div><strong>Uji pemahaman</strong><small>Kerjakan kuis dan refleksi.</small></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="document.getElementById('quiz-${t.id}').scrollIntoView({behavior:'smooth'})">Ke kuis ↓</button></div><div class="panel" style="margin-top:14px"><div class="eyebrow">SOURCES</div><p class="muted smalltext">Gunakan dokumentasi resmi dan referensi pada menu Referensi untuk memverifikasi detail yang bergantung pada versi sistem operasi.</p><button class="btn small" onclick="go('references')">Buka referensi ↗</button></div></aside></div>`}

function directorySim(){return `<div class="diagram"><div class="eyebrow">EXPLORE A DIRECTORY TREE</div><div class="file-layout"><div class="tree" id="treeRoot"><div class="tree-row" data-file="root">⌄ 📁 Sekolah</div><div class="tree-children"><div class="tree-row" data-file="docs">⌄ 📁 Dokumen</div><div class="tree-children"><div class="tree-row" data-file="task">▤ Tugas_OS.docx</div><div class="tree-row" data-file="report">▤ Laporan_Praktik.pdf</div></div><div class="tree-row" data-file="media">⌄ 📁 Media</div><div class="tree-children"><div class="tree-row" data-file="photo">▧ Diagram_OS.png</div><div class="tree-row" data-file="video">▣ Demo_Booting.mp4</div></div><div class="tree-row" data-file="archive">▧ Backup_Latihan.zip</div></div></div><div class="file-detail" id="fileDetail"><div class="eyebrow">FILE INSPECTOR</div><p class="muted smalltext">Pilih file atau folder pada pohon direktori.</p></div></div><p class="muted smalltext">Nama, ukuran, dan tanggal di panel inspector adalah metadata contoh.</p></div>`}
function fileManagerSim(){return `<div class="diagram"><div class="eyebrow">VIRTUAL FILE MANAGER</div><p class="muted smalltext">Kelola file dummy. Operasi tidak menyentuh file asli perangkat.</p><div class="sim-controls"><input id="newFolderName" placeholder="Nama folder baru"><button class="btn small" id="createFolder">＋ Buat folder</button><input id="newFileName" placeholder="Nama file baru"><button class="btn small" id="createFile">＋ Buat file</button></div><div class="file-list" id="virtualFileList"></div><div class="detailbox" id="fileManagerMsg">Pilih operasi pada file untuk melihat perubahan.</div></div>`}
function terminalSim(){return `<div class="diagram"><div class="eyebrow">SAFE VIRTUAL TERMINAL</div><div class="sim-controls"><label for="terminalOS">Shell</label><select id="terminalOS"><option value="win">Windows CMD</option><option value="linux">Linux shell</option></select><button class="btn small" id="termHelp">Tampilkan bantuan</button><button class="btn small" id="termReset">Reset simulator</button></div><div class="sim-shell"><div class="shell-top"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span id="shellTitle">virtual-cmd · dummy filesystem</span></div><div class="shell-output" id="shellOutput" aria-live="polite">Digital Computer Lab — Terminal virtual aman\nKetik "help" untuk melihat perintah yang didukung.\nPerintah hanya mengubah file dummy di simulator.</div><form class="shell-input" id="termForm"><span id="termPrompt" style="color:#74e7bd;align-self:center;font:12px ui-monospace">C:\\Lab&gt;</span><input id="termCommand" autocomplete="off" spellcheck="false" aria-label="Perintah terminal" placeholder="Ketik perintah, misalnya dir"><button type="submit">Jalankan</button></form></div><p class="muted smalltext">Didukung: dir/ls, cd, pwd, mkdir, copy/cp, move/mv, ren, help, clear. Hanya perintah yang tercantum diproses; perintah lain ditolak.</p></div>`}
function backupSim(){return `<div class="diagram"><div class="eyebrow">BACKUP STRATEGY PLANNER</div><p>Pilih strategi untuk melihat apakah rancangan memenuhi panduan dasar 3-2-1.</p><div class="sim-controls"><label for="backupCopies">Jumlah salinan total</label><select id="backupCopies"><option value="1">1 salinan</option><option value="2">2 salinan</option><option value="3" selected>3 salinan</option><option value="4">4 salinan</option></select><label for="backupMedia">Jenis media</label><select id="backupMedia"><option value="1">1 jenis media</option><option value="2" selected>2 jenis media</option><option value="3">3 jenis media</option></select><label for="backupOffsite">Salinan offsite</label><select id="backupOffsite"><option value="no">Belum ada</option><option value="yes" selected>Ada</option></select></div><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:8px"><div class="stat" style="display:block"><div class="stat-icon">💻</div><strong style="font-size:14px">Salinan utama</strong><span>Perangkat kerja</span></div><div class="stat" style="display:block"><div class="stat-icon">▤</div><strong style="font-size:14px">Salinan kedua</strong><span>Media berbeda</span></div><div class="stat" style="display:block"><div class="stat-icon">☁</div><strong style="font-size:14px">Offsite</strong><span>Lokasi terpisah</span></div></div><div class="feedback good" id="backupFeedback">Rancangan memenuhi tiga unsur dasar 3-2-1. Tetap uji pemulihan dan lindungi salinan dari akses tidak sah.</div><div class="sim-controls"><label for="backupFrequency">Frekuensi backup</label><select id="backupFrequency"><option>Setiap hari</option><option selected>Setiap minggu</option><option>Setiap bulan</option><option>Tidak terjadwal</option></select><button class="btn small" id="backupCheck">Evaluasi strategi</button></div></div>`}
function attachPageHandlers(page){const c=document.getElementById('content');c.querySelectorAll('.visual-explainer [data-visual-node]').forEach(node=>{const activate=()=>{const box=node.closest('.visual-explainer');box.querySelectorAll('[data-visual-node]').forEach(n=>{n.classList.toggle('selected',n===node);n.setAttribute('aria-pressed',n===node?'true':'false')});const title=node.querySelector('b')?.textContent?.trim()||'Elemen diagram';const desc=node.querySelector('small')?.textContent?.trim()||'Elemen ini merupakan bagian dari visualisasi.';box.querySelector('.visual-detail').innerHTML='<strong>'+esc(title)+'</strong><div>'+esc(desc)+'</div>'};node.setAttribute('aria-pressed','false');node.addEventListener('click',activate);node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}})});c.querySelectorAll('[data-goto]').forEach(el=>{el.addEventListener('click',()=>go(el.dataset.goto));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(el.dataset.goto)}})});
c.querySelectorAll('[data-layer]').forEach(b=>b.addEventListener('click',()=>{c.querySelectorAll('[data-layer]').forEach(x=>x.classList.toggle('selected',x===b));const d=['Pengguna berinteraksi melalui input seperti klik, keyboard, atau sentuhan. Hasilnya ditampilkan kembali melalui aplikasi.','Aplikasi menyediakan fungsi untuk tugas tertentu dan meminta layanan kepada sistem operasi saat memerlukan sumber daya.','Sistem operasi mengelola sumber daya dan menyediakan layanan umum bagi aplikasi, misalnya akses file dan perangkat.','Perangkat keras menjalankan instruksi, menyimpan data, dan menyediakan input atau output. OS mengoordinasikan penggunaannya.'];c.querySelector('#layerDetail').textContent=d[+b.dataset.layer]}));
